<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tie-Break Club</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16384a">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#f4efe3;--pn:#fffdf7;--pn2:#f0e9d8;--ln:#e0d6bd;--tx:#2b3a33;--mu:#7b8a80;--gr:#3f9d6b;--gr2:#2c7a52;--yl:#e9c63a;--or:#e8863a;--bl:#2f7fb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#hd{padding:calc(env(safe-area-inset-top) + 40px) 14px 8px;background:#16384a;color:#fff;text-align:center;flex:none}
#hd .m{font-size:30px;font-weight:800;color:var(--yl);line-height:1.1}
#hd .s{font-size:12.5px;opacity:.85;margin-top:2px}
#sc{flex:none;position:relative;background:#16384a}
#cv{display:block;width:100%;touch-action:none}
#hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#fff;opacity:.85;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#tabs{display:flex;background:var(--pn);border-bottom:1px solid var(--ln);flex:none}
#tabs button{flex:1;padding:11px 2px;font-size:12px;font-weight:700;color:var(--mu);position:relative}
#tabs button.on{color:var(--gr2)}
#tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:2px;background:var(--gr)}
#tabs .dot{position:absolute;top:7px;right:14%;width:8px;height:8px;border-radius:50%;background:var(--or)}
#main{flex:1;overflow-y:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 16px);-webkit-overflow-scrolling:touch}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.row{display:flex;gap:10px;align-items:center}
.row .inf{flex:1;min-width:0}
.nm{font-weight:800;font-size:15px}
.nm i{font-style:normal;color:var(--gr2);font-size:13px;margin-left:6px}
.ds{font-size:12px;color:var(--mu);margin-top:2px;line-height:1.3}
.pr{font-size:12px;color:var(--bl);margin-top:3px;font-weight:600}
.btn{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.btn:active{transform:scale(.97)}
.btn.gr{background:linear-gradient(180deg,#52b57f,#3a9566);border-color:#2c7a52;color:#fff}
.btn.or{background:linear-gradient(180deg,#f0a04e,#dc7e2e);border-color:#c06c20;color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.by{min-width:96px;text-align:center;line-height:1.25}
.by small{display:block;font-weight:600;font-size:11px;opacity:.9}
.modes{display:flex;gap:6px;margin-bottom:10px}
.modes button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--ln);background:var(--pn);font-size:12px;font-weight:700;color:var(--mu)}
.modes button.on{background:#e3f2e9;color:var(--gr2);border-color:var(--gr)}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:12px 2px 6px;font-weight:700}
.cur{border-color:var(--gr);background:#eef8f1}
.lock{opacity:.5}
.tag{display:inline-block;font-size:10.5px;font-weight:800;background:var(--gr);color:#fff;border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:1px}
#modal{position:fixed;inset:0;background:rgba(20,30,25,.55);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--pn);border-radius:18px;padding:20px 18px;width:100%;max-width:340px;max-height:86vh;overflow:auto;text-align:center}
#modal h2{margin:0 0 8px;font-size:20px;color:var(--gr2)}
#modal p{font-size:14px;line-height:1.5;margin:8px 0}
#modal .col{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#16384a;color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;z-index:30;display:none;max-width:88%;text-align:center}
.mu{color:var(--mu)}
.log{font-size:12.5px;line-height:1.55}
textarea{width:100%;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:9px;font:12px monospace;color:var(--tx)}
</style>
</head>
<body>
<div id="app">
 <div id="hd"><div class="m" id="mn"></div><div class="s" id="ms"></div></div>
 <div id="sc"><canvas id="cv"></canvas><div id="hint">Tocca il campo per colpire</div></div>
 <div id="tabs"></div>
 <div id="main"></div>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
/* ================= NUMERI ENORMI (mantissa + esponente) ================= */
function N(m,e){this.m=m;this.e=e}
function norm(m,e){
  if(m===0||m!==m)return new N(0,0);
  var a=Math.abs(m),k=Math.floor(Math.log10(a));
  m/=Math.pow(10,k);e+=k;
  if(Math.abs(m)>=10){m/=10;e++}else if(Math.abs(m)<1){m*=10;e--}
  return new N(m,e);
}
var Z=new N(0,0);
function n(x){return x instanceof N?x:(x===0?Z:norm(x,0))}
function add(a,b){a=n(a);b=n(b);if(!a.m)return b;if(!b.m)return a;
  if(a.e<b.e){var t=a;a=b;b=t}
  var d=a.e-b.e;if(d>16)return a;
  return norm(a.m+b.m*Math.pow(10,-d),a.e)}
function neg(a){a=n(a);return new N(-a.m,a.e)}
function sub(a,b){return add(a,neg(b))}
function mul(a,b){a=n(a);b=n(b);return norm(a.m*b.m,a.e+b.e)}
function div(a,b){a=n(a);b=n(b);return norm(a.m/b.m,a.e-b.e)}
function cmp(a,b){a=n(a);b=n(b);
  if(!a.m&&!b.m)return 0;
  if(a.m>0&&b.m<=0)return 1;if(a.m<=0&&b.m>0)return -1;
  if(!a.m)return b.m>0?-1:1;if(!b.m)return a.m>0?1:-1;
  var s=a.m>0?1:-1;
  if(a.e!==b.e)return (a.e>b.e?1:-1)*s;
  return a.m===b.m?0:(a.m>b.m?1:-1)}
function gte(a,b){return cmp(a,b)>=0}
function lg(a){a=n(a);return a.m>0?Math.log10(a.m)+a.e:-Infinity}
function pw(a,x){a=n(a);if(!a.m)return Z;var l=(Math.log10(a.m)+a.e)*x,e=Math.floor(l);return norm(Math.pow(10,l-e),e)}
function p10(x){var e=Math.floor(x);return norm(Math.pow(10,x-e),e)}
function toNum(a){a=n(a);return a.m*Math.pow(10,a.e)}
function floor(a){a=n(a);return a.e>=15?a:norm(Math.floor(toNum(a)+1e-9),0)}
function mx(a,b){return cmp(a,b)>=0?n(a):n(b)}
function mn(a,b){return cmp(a,b)<=0?n(a):n(b)}
function ser(a){a=n(a);return a.m+'e'+a.e}
function par(s){if(s instanceof N)return s;if(typeof s==='number')return n(s);if(typeof s!=='string')return Z;var i=s.indexOf('e');if(i<0)return n(parseFloat(s)||0);return norm(parseFloat(s.slice(0,i))||0,parseInt(s.slice(i+1))||0)}
function fmt(a,dec){
  a=n(a);if(!a.m)return '0';
  if(a.e<6){
    var v=toNum(a);
    if(a.e<3)return (Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):v.toFixed(dec===undefined?(a.e<1?2:1):dec)).replace('.',',');
    return Math.floor(v).toLocaleString('it-IT');
  }
  return a.m.toFixed(2).replace('.',',')+'e'+a.e;
}
function fmtT(sec){sec=Math.max(0,Math.floor(sec));var d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d)return d+'g '+h+'h';if(h)return h+'h '+m+'m';if(m)return m+'m '+(sec%60)+'s';return sec+'s'}



/* ================= DATI ================= */
var SHOTS=[
 ['Palleggio',0,1,'Due colpi tranquilli per scaldarsi.'],
 ['Dritto',60,3,'Il colpo base, preciso e pulito.'],
 ['Rovescio',500,10,'A una mano o a due: l’importante è il ritmo.'],
 ['Slice',4e3,35,'Palla tagliata che scivola bassa.'],
 ['Volée',3.5e4,120,'Al volo, a rete, con sicurezza.'],
 ['Smash',3e5,420,'Schiacciata dall’alto, che botto.'],
 ['Servizio',2.5e6,1.5e3,'Il colpo più elegante del tennis.'],
 ['Kick serve',2e7,5.5e3,'Rimbalza alto e fa saltare l’avversario.'],
 ['Passante',2e8,2e4,'Lungolinea, al millimetro.'],
 ['Smorzata',2e9,7e4,'Un tocco morbido che muore oltre la rete.'],
 ['Colpo vincente',2e10,2.5e5,'Nessuno ci arriva.'],
 ['Tweener',3e11,9e5,'Fra le gambe, con stile da fenomeno.'],
 ['Ace perfetto',5e12,3.5e6,'Un lampo sulla riga.'],
 ['Colpo leggendario',1e14,1.4e7,'Se ne parlerà per anni.']
];
var RACK=[['Racchetta di legno',0,1],['Alluminio',300,1.6],['Grafite',5e3,3],['Fibra di carbonio',8e4,6],['Titanio',1.2e6,12],['Nanotubi',2e7,25],['Pro Staff',3e8,55],['Edizione limitata',5e9,120],['Racchetta d’oro',1e11,280],['Racchetta stellare',3e12,650],['Racchetta leggendaria',1e14,1500]];
var BALL=[['Palline usate',0,1],['Palline nuove',200,1.4],['Palline pro',3e3,2.2],['Palline optic',5e4,4],['Palline slam',8e5,8],['Palline di cristallo',1.5e7,16],['Palline nebulari',3e8,34],['Palline dorate',6e9,75],['Palline cosmiche',2e11,170]];
var SPAR=[
 {id:'pal',n:'Palleggiatore',c:80,r:.3,ds:'Uno sparring paziente che palleggia con te.'},
 {id:'lan',n:'Lanciapalle',c:900,r:1.5,ds:'Macchina che non si stanca mai.'},
 {id:'all',n:'Allenatore',c:1.1e4,r:7,ds:'Corregge il gesto e tiene il ritmo.'},
 {id:'cpr',n:'Coach professionista',c:1.4e5,r:35,ds:'Piani di allenamento su misura.'},
 {id:'acc',n:'Accademia',c:2e6,r:180,ds:'Un campus di giovani promesse.'},
 {id:'naz',n:'Squadra nazionale',c:3e7,r:900,ds:'La maglia azzurra viene a giocare da te.'},
 {id:'cam',n:'Campione',c:5e8,r:5e3,ds:'Un numero uno si allena nel tuo circolo.'},
 {id:'leg',n:'Leggenda',c:9e9,r:3e4,ds:'Un mito vivente ti offre un palleggio.'},
 {id:'mae',n:'Maestro dei maestri',c:2e11,r:2e5,ds:'Insegna tutto, anche a se stesso.'}
];
var DECO=[
 ['bench','Panchina',400,.03,'Un posto dove riposare tra un game e l’altro.'],
 ['net','Rete nuova',1.5e3,.03,'Bianca, tesa, impeccabile.'],
 ['board','Cartelloni sponsor',6e3,.04,'Qualcuno paga per farsi vedere.'],
 ['plant','Fioriere',2.5e4,.04,'Un tocco di colore a bordo campo.'],
 ['umb','Ombrelloni',1e5,.05,'Per chi guarda dalla sedia a sdraio.'],
 ['light','Luci serali',4e5,.05,'Si gioca anche al tramonto.'],
 ['palm','Palme',1.5e6,.06,'Aria di vacanza.'],
 ['stand','Tribunetta',6e6,.06,'Arrivano i primi tifosi.'],
 ['bar','Bar del circolo',3e7,.07,'Caffè, spremute e panini.'],
 ['flag','Bandiere',1.2e8,.07,'Da tutto il mondo.'],
 ['screen','Maxischermo',5e8,.08,'Rivedi gli scambi più belli.'],
 ['roof','Tribuna coperta',2.5e9,.09,'Gli spettatori restano all’asciutto.'],
 ['fount','Fontana',1.2e10,.10,'Si sente l’acqua anche sul campo.'],
 ['heli','Elicottero',6e10,.12,'Le riprese dall’alto.'],
 ['stad','Stadio',5e11,.15,'Il tuo circolo diventa uno stadio.']
];
var KEY='tiebreak-club-v1';var CFG={AP:1,SP:.8,Q:.6};
var SEASON_AT=1e12;

/* ================= STATO ================= */
function fresh(){return{v:1,m:Z,tot:Z,ok:Z,shot:0,rack:0,ball:0,tech:0,fit:0,spar:{},deco:{},troph:0,seasons:0,tab:'shot',mode:1,played:0,last:Date.now(),best:Z,hits:0}}
var S=fresh();
function sc(id){return S.spar[id]||Z}
function save(){try{var o={v:1,m:ser(S.m),tot:ser(S.tot),ok:ser(S.ok),best:ser(S.best),shot:S.shot,rack:S.rack,ball:S.ball,tech:S.tech,fit:S.fit,spar:{},deco:S.deco,troph:S.troph,seasons:S.seasons,tab:S.tab,mode:S.mode,played:S.played,hits:S.hits,last:Date.now()};for(var k in S.spar)o.spar[k]=ser(S.spar[k]);localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function load(raw){try{var o=JSON.parse(raw||localStorage.getItem(KEY));if(!o||o.v!==1)return false;var s=fresh();['m','tot','ok','best'].forEach(function(k){s[k]=par(o[k])});['shot','rack','ball','tech','fit','troph','seasons','mode','played','hits','last'].forEach(function(k){if(o[k]!==undefined)s[k]=o[k]});s.tab=o.tab||'shot';s.deco=o.deco||{};s.spar={};for(var k in o.spar||{})s.spar[k]=par(o.spar[k]);S=s;return true}catch(e){return false}}

/* ================= CALCOLI ================= */
function decoBonus(){var b=0;DECO.forEach(function(d){if(S.deco[d[0]])b+=d[3]});return b}
function techMult(){return Math.pow(1.12,S.tech)}
function fitMult(){return Math.pow(1.1,S.fit)}
function trophMult(){return 1+.2*S.troph}
function hitValue(){return mul(mul(SHOTS[S.shot][2],RACK[S.rack][2]+BALL[S.ball][2]-1),(1+decoBonus())*techMult()*trophMult())}
function msM(c){var x=toNum(c);if(x<25)return 1;return Math.pow(2,1+Math.floor(Math.log2(x/25)))}
function autoRate(){var a=Z;SPAR.forEach(function(s){var c=sc(s.id);if(c.m)a=add(a,mul(mul(c,s.r),msM(c)))});return mul(pw(mx(a,1e-9),CFG.AP),fitMult())}
var CA={H:Z,A:Z,inc:Z,tap:Z};
function calc(){var H=pw(mx(hitValue(),1e-9),CFG.Q),A=autoRate();CA.H=H;CA.A=A;CA.inc=mul(H,pw(mx(A,1e-9),CFG.Q));if(!A.m)CA.inc=Z;CA.tap=mul(H,Math.min(1e15,1+.05*toNum(A)));return CA}
function Qp(x){return Math.pow(x,CFG.Q)}
function pc(x){return '+'+Math.round((Qp(x)-1)*100)+'%'}
function hv(i){return pw(mx(mul(mul(SHOTS[i][2],RACK[S.rack][2]+BALL[S.ball][2]-1),(1+decoBonus())*techMult()*trophMult()),1e-9),CFG.Q)}
function techCost(){return mul(200,pw(1.6,S.tech))}
function fitCost(){return mul(500,pw(1.7,S.fit))}
function sf(){return Math.pow(SHOTS[S.shot][2]*(RACK[S.rack][2]+BALL[S.ball][2]-1),CFG.SP)}
function sCost(s,k){var own=sc(s.id),b=mul(mul(s.c,sf()),pw(1.15,toNum(own)));return mul(b,div(sub(pw(1.15,k),1),.15))}
function sMax(s){var own=sc(s.id),b=mul(mul(s.c,sf()),pw(1.15,toNum(own)));var x=div(mul(S.m,.15),b);if(cmp(x,1e-12)<0)return 0;return Math.max(0,Math.floor(Math.log10(1+toNum(x))/Math.log10(1.15)+1e-9))}
function tickGain(dt){calc();var g=mul(CA.inc,dt);S.m=add(S.m,g);S.tot=add(S.tot,g);S.ok=add(S.ok,g);if(cmp(S.tot,S.best)>0)S.best=S.tot}
function addMoney(v){S.m=add(S.m,v);S.tot=add(S.tot,v);S.ok=add(S.ok,v)}
function pay(c){if(cmp(S.m,c)<0)return false;S.m=mx(0,sub(S.m,c));return true}
function seasonGain(){if(cmp(S.tot,SEASON_AT)<0)return 0;return Math.floor(Math.pow(toNum(div(S.tot,SEASON_AT)),.35)+1e-9)}
function newSeason(){var g=seasonGain();if(g<1)return 0;S.troph+=g;S.seasons++;S.m=Z;S.tot=Z;S.shot=0;S.rack=0;S.ball=0;S.tech=0;S.fit=0;S.spar={};return g}

/* ================= GRAFICA (canvas) ================= */
var cv=$('cv'),cx=cv.getContext('2d'),VW=360,VH=250,DPR=1;
function fitCanvas(){var w=Math.min(window.innerWidth,520);DPR=Math.min(2,window.devicePixelRatio||1);cv.style.width=w+'px';cv.style.height=(w*VH/VW)+'px';cv.width=Math.round(w*DPR);cv.height=Math.round(w*VH/VW*DPR)}
window.addEventListener('resize',fitCanvas);
var T=0,rally=0,ballPh=0,swing=0,floats=[],pops={},lastDeco={},lastTop='';
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function circ(x,y,r,c){cx.fillStyle=c;cx.beginPath();cx.arc(x,y,r,0,6.3);cx.fill()}
function courtX(y,u){ // u in [-1,1] -> x at depth y
  var t=(y-105)/(235-105),hw=100+t*(180-100);return 180+u*hw}
function drawTree(x,y,s,c){cx.fillStyle='#6b4a2c';cx.fillRect(x-2*s,y-8*s,4*s,10*s);circ(x,y-14*s,9*s,c);circ(x-6*s,y-9*s,6*s,c);circ(x+6*s,y-9*s,6*s,c)}
function dusk(){return S.deco.light?.55:0}
function drawScene(){
  var dk=dusk(),stadium=!!S.deco.stad;
  cx.setTransform(cv.width/VW,0,0,cv.width/VW,0,0);
  // cielo
  var g=cx.createLinearGradient(0,0,0,110);
  if(dk){g.addColorStop(0,'#2a2f5e');g.addColorStop(1,'#f0a06a')}else{g.addColorStop(0,'#7cc4ee');g.addColorStop(1,'#d9f0ff')}
  cx.fillStyle=g;cx.fillRect(0,0,VW,VH);
  // colline
  cx.fillStyle=dk?'#2d5a48':'#8fcf8a';cx.beginPath();cx.moveTo(0,100);cx.quadraticCurveTo(80,70,170,95);cx.quadraticCurveTo(260,70,360,98);cx.lineTo(360,125);cx.lineTo(0,125);cx.fill();
  cx.fillStyle=dk?'#245044':'#6fb87a';cx.beginPath();cx.moveTo(0,108);cx.quadraticCurveTo(100,90,200,108);cx.quadraticCurveTo(290,92,360,108);cx.lineTo(360,125);cx.lineTo(0,125);cx.fill();
  if(stadium){ // anelli di stadio
    cx.fillStyle=dk?'#3b4258':'#b9c2d0';rr(10,58,340,60,18);cx.fill();cx.fillStyle=dk?'#2a3044':'#9aa5b6';rr(20,70,320,48,14);cx.fill();
    for(var i=0;i<46;i++){circ(24+i*7,82+((i*17)%5),2.2,['#e9c63a','#e8863a','#3a8ab8','#ec6b7a','#fff'][i%5])}
  }
  drawTree(30,112,1,dk?'#2f6a4c':'#4fa264');drawTree(330,112,1.1,dk?'#2f6a4c':'#4fa264');

function morph(a,b){while(a.childNodes.length>b.childNodes.length)a.removeChild(a.lastChild);for(var i=0;i<b.childNodes.length;i++){var x=a.childNodes[i],y=b.childNodes[i];if(!x){a.appendChild(y.cloneNode(true));continue}if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y.cloneNode(true),x);continue}if(x.nodeType===3){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}if(x.nodeType!==1)continue;if(x.nodeName==='TEXTAREA')continue;syncAttrs(x,y);morph(x,y)}}

function render(){
  renderTop();renderTabs();
  var m=$('main'),h=S.tab==='shot'?renderShot():(S.tab==='gear'?renderGear():(S.tab==='spar'?renderSpar():(S.tab==='club'?renderClub():renderAlt())));
  var t=document.createElement('div');t.innerHTML=h;var st=m.scrollTop;
  if(shownTab!==S.tab){m.innerHTML='';shownTab=S.tab}
  morph(m,t);m.scrollTop=st;
}

/* ================= EVENTI ================= */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;
  if(a==='close'){closeModal();return}
  if(a==='tab'){S.tab=v;render();$('main').scrollTop=0;return}
  if(a==='mode'){S.mode=v==='max'?'max':+v;render();return}
  if(a==='tech'){if(pay(techCost())){S.tech++;render();save()}return}
  if(a==='fit'){if(pay(fitCost())){S.fit++;render();save()}return}
  if(a==='shot'){var i=+v;if(i===S.shot+1&&pay(SHOTS[i][1])){S.shot=i;toast('Nuovo colpo: '+SHOTS[i][0]);render();save()}return}
  if(a==='rack'){var i2=+v;if(i2===S.rack+1&&pay(RACK[i2][1])){S.rack=i2;toast(RACK[i2][0]);render();save()}return}
  if(a==='ball'){var i3=+v;if(i3===S.ball+1&&pay(BALL[i3][1])){S.ball=i3;toast(BALL[i3][0]);render();save()}return}
  if(a==='spar'){var s=SPAR.filter(function(x){return x.id===v})[0],k=S.mode==='max'?sMax(s):S.mode;if(k>=1&&pay(sCost(s,k))){S.spar[v]=add(sc(v),k);render();save()}return}
  if(a==='deco'){var d=DECO.filter(function(x){return x[0]===v})[0];if(!S.deco[v]&&pay(d[2])){S.deco[v]=1;toast(d[1]+' aggiunto al circolo');render();save()}return}
  if(a==='season'){var g=seasonGain();modal('<h2>Nuova stagione?</h2><p>Ottieni <b>+'+g+' trofei</b> (circa +'+Math.round((Qp(1+.2*(S.troph+g))/Qp(1+.2*S.troph)-1)*100)+'% di guadagno). Colpi, attrezzatura e sparring ripartono da zero; il circolo resta.</p><div class="col"><button class="btn or" data-a="season2">Inizia</button><button class="btn" data-a="close">Aspetta ancora</button></div>');return}
  if(a==='season2'){var gg=newSeason();closeModal();render();save();if(gg)toast('+'+gg+' trofei');return}
  if(a==='export'){save();$('sv').value=btoa(unescape(encodeURIComponent(localStorage.getItem(KEY)||'')));return}
  if(a==='import'){var t=$('sv').value.trim();try{var raw=decodeURIComponent(escape(atob(t)));if(load(raw)){save();render();toast('Salvataggio caricato')}else toast('Codice non valido')}catch(e){toast('Codice non valido')}return}
  if(a==='reset'){modal('<h2>Cancellare tutto?</h2><p>Perderai circolo, trofei e progressi.</p><div class="col"><button class="btn" style="color:#c0443a" data-a="reset2">Sì, cancella</button><button class="btn" data-a="close">No</button></div>');return}
  if(a==='reset2'){S=fresh();save();closeModal();render();return}
});

/* ================= CICLO E OFFLINE ================= */
var lastT=0,uiT=0,saveT=0;
function loop(ts){
  var dt=Math.min(.5,(ts-lastT)/1000||0);lastT=ts;
  if(dt>0){S.played+=dt;tickGain(dt);frame(dt);renderTop();uiT+=dt;saveT+=dt;if(uiT>=.3){uiT=0;render()}if(saveT>=10){saveT=0;save()}}
  requestAnimationFrame(loop);
}
function offline(sec){var cap=12*3600,use=Math.min(sec,cap);calc();var g=mul(CA.inc,use);if(cmp(g,0)>0){S.m=add(S.m,g);S.tot=add(S.tot,g);S.ok=add(S.ok,g);if(cmp(S.tot,S.best)>0)S.best=S.tot;modal('<h2>Bentornato!</h2><p>Mentre eri via il circolo ha lavorato per <b>'+fmtT(use)+'</b>.</p><p>Hai guadagnato <b>+'+fmt(g)+' €</b></p><div class="col"><button class="btn gr" data-a="close">Grazie</button></div>')}}
document.addEventListener('visibilitychange',function(){if(document.hidden){save();return}var sec=(Date.now()-S.last)/1000;if(sec>30)offline(sec);S.last=Date.now()});
window.addEventListener('pagehide',save);

/* ================= AVVIO ================= */
fitCanvas();
if(load()){var s0=(Date.now()-S.last)/1000;calc();if(s0>30)offline(s0)}
else{S.m=n(0);modal('<h2>Tie-Break Club</h2><p>Un campo da tennis, una racchetta e tutto il tempo del mondo. Tocca il campo per colpire, poi migliora colpi, attrezzatura e circolo.</p><p class="mu">Nessuna fretta: qui non si perde mai.</p><div class="col"><button class="btn gr" data-a="close">Entriamo in campo</button></div>')}
S.last=Date.now();calc();render();requestAnimationFrame(loop);
window.TB={CFG:CFG,get S(){return S},set S(v){S=v},calc:calc,CA:CA,hit:hit,SHOTS:SHOTS,RACK:RACK,BALL:BALL,SPAR:SPAR,DECO:DECO,sCost:sCost,sMax:sMax,techCost:techCost,fitCost:fitCost,pay:pay,fmt:fmt,fresh:fresh,tickGain:tickGain,cmp:cmp,toNum:toNum,add:add,n:n,seasonGain:seasonGain,newSeason:newSeason,sc:sc,fmtT:fmtT};
})();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){var hadC=!!navigator.serviceWorker.controller,rl=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadC&&!rl){rl=true;location.reload()}});navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){r.update();document.addEventListener("visibilitychange",function(){if(!document.hidden)r.update()})}).catch(function(){})}
</script>
