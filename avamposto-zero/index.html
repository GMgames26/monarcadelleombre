<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Avamposto Zero</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060b16">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#060b16;--pn:#0e1627;--pn2:#142039;--ln:#22335a;--cy:#36e0ff;--gr:#5dff9a;--or:#ffb04a;--rd:#ff5a6e;--tx:#e6f0ff;--mu:#8296b8;--em:#3dffb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 10px);overflow:auto}
.scr.on{display:flex}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:linear-gradient(180deg,#1a2c52,#122044);border:1px solid var(--ln);border-radius:12px;padding:13px 16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,#1fb6d6,#0f7f9c);border-color:#4be3ff;color:#031018;box-shadow:0 0 18px rgba(54,224,255,.35)}
.btn.gr{background:linear-gradient(180deg,#2bd27a,#16905a);border-color:#6dffae;color:#031a0e}
.btn.or{background:linear-gradient(180deg,#e89a2c,#b06a12);border-color:#ffc874;color:#1c0f00}
.btn.rd{background:linear-gradient(180deg,#c9344a,#8d2033);border-color:#ff7f90}
.btn[disabled]{opacity:.4;pointer-events:none}
.mu{color:var(--mu)}
.em{color:var(--em);font-weight:800}
/* home */
#home{background:radial-gradient(ellipse at 50% 0%,#12305a 0%,#070d1c 60%),var(--bg);justify-content:center;align-items:center;text-align:center;gap:14px}
#home .logo{width:128px;height:128px;border-radius:28px;box-shadow:0 0 40px rgba(54,224,255,.35);margin-bottom:6px}
#home h1{font-size:38px;line-height:1;color:#fff;text-shadow:0 0 24px rgba(54,224,255,.6)}
#home h1 span{display:block;color:var(--cy);font-size:20px;letter-spacing:.5em;margin-top:6px}
#home .sub{max-width:280px;font-size:14px}
#home .col{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:10px}
/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:12px 0}
.bar .t{flex:1;text-align:center;font-size:15px}
.ib{width:42px;height:42px;border-radius:12px;background:var(--pn2);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.gem{display:inline-flex;align-items:center;gap:6px;background:var(--pn2);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-weight:800;color:var(--em)}
.gem i{width:10px;height:10px;transform:rotate(45deg);background:var(--em);display:inline-block;border-radius:2px;box-shadow:0 0 8px var(--em)}
/* levels */
.wt{display:flex;gap:8px;margin-bottom:12px}
.wt button{flex:1;padding:12px 6px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.wt button.on{background:linear-gradient(180deg,#1d3a6a,#142a52);border-color:var(--cy);box-shadow:0 0 14px rgba(54,224,255,.25)}
.wt button[disabled]{opacity:.4}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lv{aspect-ratio:1/.95;border-radius:16px;background:var(--pn);border:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative}
.lv b{font-size:28px;line-height:1}
.lv .st{font-size:14px;letter-spacing:2px;color:#ffd24a}
.lv .st s{color:#2b3a5e;text-decoration:none}
.lv.lk{opacity:.4}
.lv.boss{border-color:var(--rd);background:linear-gradient(180deg,#2a1226,#140c1c)}
.lv.boss em{position:absolute;top:6px;right:8px;font-size:10px;font-style:normal;color:var(--rd);font-weight:800;letter-spacing:.08em}
.lv.cur{border-color:var(--cy);box-shadow:0 0 14px rgba(54,224,255,.35)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}
/* upgrades */
.ug{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ug .tx{flex:1}
.ug .tx b{display:block;font-size:15px}
.ug .tx span{font-size:12px;color:var(--mu)}
.ug .pips{display:flex;gap:4px;margin-top:6px}
.ug .pips i{width:18px;height:6px;border-radius:3px;background:#243558}
.ug .pips i.f{background:var(--em);box-shadow:0 0 6px var(--em)}
/* game */
#game{padding:0}
#hud{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px}
#hud .st{flex:1;display:flex;gap:8px;justify-content:center;font-weight:800;font-size:15px}
#hud .st span{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:6px 9px;white-space:nowrap}
#hud .hp{color:#ff7d8c}#hud .gd{color:#ffd24a}#hud .wv{color:var(--cy)}
#hud .ib{width:38px;height:38px;font-size:15px}
#prev{min-height:30px;padding:0 10px 6px;display:flex;gap:6px;overflow-x:auto;white-space:nowrap;align-items:center;font-size:12px}
#prev .ch{background:var(--pn2);border:1px solid var(--ln);border-radius:14px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px}
#prev .ch i{width:9px;height:9px;border-radius:50%;display:inline-block}
#cvwrap{flex:0 0 auto;display:flex;justify-content:center;align-items:center}
#cv{display:block;border-radius:12px;touch-action:none}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
#wavebar{display:flex;gap:8px;align-items:center}
#wavebar .btn{flex:1;padding:11px 10px}
#wavebar .inf{font-size:12px;color:var(--mu);flex:1.1;line-height:1.3}
#sheet{flex:1;min-height:0;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:8px;overflow:auto}
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tb{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700}
.tb img{width:38px;height:38px}
.tb .c{color:#ffd24a;font-weight:800}
.tb.no{opacity:.4}
.tb.lk{opacity:.28}
.ti{display:flex;gap:10px;align-items:flex-start}
.ti img{width:54px;height:54px;flex:none}
.ti .d{flex:1;font-size:12px;line-height:1.35}
.ti .d b{font-size:15px}
.st3{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0;font-size:11px;text-align:center}
.st3 div{background:var(--pn2);border-radius:8px;padding:4px 2px}
.st3 b{display:block;font-size:13px;color:#fff}
.br{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.br .btn{padding:7px 8px;font-size:11px;text-transform:none;line-height:1.25;text-align:left}
.br .btn small{display:block;opacity:.8;font-weight:500;font-size:10.5px}
.row2{display:flex;gap:6px;margin-top:6px}
.row2 .btn{flex:1;padding:9px 8px;font-size:12px}
.syn{font-size:11px;color:var(--gr);margin-top:3px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(2,5,12,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#modal.on{display:flex}
#modal .box{background:linear-gradient(180deg,#13203c,#0b1426);border:1px solid var(--ln);border-radius:18px;padding:20px 18px;width:100%;max-width:340px;max-height:86vh;overflow:auto;text-align:center}
#modal h2{font-size:22px;margin-bottom:10px}
#modal p{font-size:14px;line-height:1.45;margin:6px 0}
#modal .stars{font-size:38px;letter-spacing:6px;color:#ffd24a;margin:6px 0}
#modal .stars s{color:#2b3a5e;text-decoration:none}
#modal .col{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#modal .help{text-align:left;font-size:13px}
#modal .help p{margin:8px 0}
#modal .help b{color:var(--cy)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:#0c1a36;border:1px solid var(--cy);color:var(--tx);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;z-index:30;display:none;max-width:88%;text-align:center}
</style>
</head>
<body>
<div id="app">
 <section id="home" class="scr on">
  <img class="logo" src="icon-192.png" alt="">
  <h1>Avamposto<span>ZERO</span></h1>
  <div class="sub mu">Difendi l’ultima base dalle ondate nemiche. Pianifica le torri, ogni scelta conta.</div>
  <div class="col">
   <button class="btn pri" data-a="play">Gioca</button>
   <button class="btn gr" data-a="upg">Potenziamenti <span class="em" id="hgem"></span></button>
   <button class="btn" data-a="help">Come si gioca</button>
  </div>
 </section>

 <section id="levels" class="scr">
  <div class="bar"><button class="ib" data-a="home">‹</button><h2 class="t">Missioni</h2><span class="gem"><i></i><b id="lgem">0</b></span></div>
  <div class="wt" id="wtabs"></div>
  <div class="lg" id="lgrid"></div>
  <div class="card mu" id="wdesc" style="margin-top:14px;font-size:13px;line-height:1.45"></div>
 </section>

 <section id="upg" class="scr">
  <div class="bar"><button class="ib" data-a="home">‹</button><h2 class="t">Potenziamenti</h2><span class="gem"><i></i><b id="ugem">0</b></span></div>
  <div class="mu" style="font-size:13px;margin-bottom:12px">Gli smeraldi si ottengono con le stelle dei livelli. I potenziamenti valgono per tutte le missioni.</div>
  <div id="ulist"></div>
 </section>

 <section id="game" class="scr">
  <div id="hud">
   <button class="ib" data-a="back">‹</button>
   <div class="st"><span class="hp" id="hhp">♥ 20</span><span class="gd" id="hgd">● 0</span><span class="wv" id="hwv">1/8</span></div>
   <button class="ib" data-a="speed" id="bspd">x1</button>
   <button class="ib" data-a="pause" id="bpau">❚❚</button>
  </div>
  <div id="prev"></div>
  <div id="cvwrap"><canvas id="cv"></canvas></div>
  <div id="panel">
   <div id="wavebar"></div>
   <div id="sheet"></div>
  </div>
 </section>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
var D=document,$=function(i){return D.getElementById(i)};
var COLS=9,ROWS=13,PERW=9,NW=2,SAVEKEY='avamposto-zero-v1';

/* ---------- salvataggio ---------- */
var save=(function(){try{var o=JSON.parse(localStorage.getItem(SAVEKEY));if(o&&o.v===1)return o}catch(e){}return{v:1,st:{},gems:0,meta:{},help:0}})();
function persist(){try{localStorage.setItem(SAVEKEY,JSON.stringify(save))}catch(e){}}
function maxDone(){var m=0;for(var k in save.st)if(save.st[k]>0&&+k>m)m=+k;return m}
function unlocked(n){return n===1||(save.st[n-1]|0)>0}
function mv(id){return save.meta[id]|0}

/* ---------- potenziamenti permanenti (smeraldi) ---------- */
var META=[
 {id:'gold0',n:'Fondi iniziali',d:'+15 oro all’inizio di ogni livello',c:[3,5,8,12,18]},
 {id:'dmg',n:'Calibratura armi',d:'+4% danno di tutte le torri',c:[4,6,9,13,18]},
 {id:'lives',n:'Scudi della base',d:'+2 vite in ogni livello',c:[3,5,8,12,16]},
 {id:'call',n:'Allerta rapida',d:'+25% oro per la chiamata anticipata',c:[3,5,8,12]},
 {id:'disc',n:'Logistica',d:'−4% costo di costruzione delle torri',c:[4,6,9,13,18]},
 {id:'rng',n:'Antenne potenziate',d:'+3% gittata di tutte le torri',c:[4,7,11,16]},
 {id:'loot',n:'Recupero rottami',d:'+5% oro dai nemici',c:[4,6,9,13,18]}
];

/* ---------- dati nemici ---------- */
var R1={phys:1,energy:1,blast:1};
var EN={
 fante:{n:'Fante',hp:38,sp:.85,gold:4,life:1,cost:1,gap:.7,from:1,col:'#9be15d',r:R1},
 corridore:{n:'Corridore',hp:22,sp:1.7,gold:3,life:1,cost:1,gap:.42,from:2,col:'#ffd84a',r:R1},
 drone:{n:'Drone',hp:34,sp:1.15,gold:5,life:1,cost:1.5,gap:.8,from:3,air:true,col:'#c78bff',r:R1},
 corazzato:{n:'Corazzato',hp:150,sp:.6,gold:11,life:2,cost:4,gap:1.4,from:4,col:'#9aa7b8',r:{phys:.4,energy:1.1,blast:.65}},
 scudato:{n:'Scudato',hp:105,sp:.75,gold:10,life:2,cost:3.6,gap:1.2,from:6,col:'#43c6ff',r:{phys:1,energy:.4,blast:1.15}},
 guaritore:{n:'Guaritore',hp:80,sp:.8,gold:12,life:1,cost:3,gap:1.3,from:8,col:'#5dff9a',heal:true,r:R1},
 boss1:{n:'Colosso Ruggine',hp:3200,sp:.42,gold:150,life:10,boss:true,col:'#ff6a4a',r:{phys:.5,energy:1,blast:.7},sum:{t:'fante',k:2,every:7}},
 boss2:{n:'Leviatano delle Sabbie',hp:14000,sp:.45,gold:250,life:10,boss:true,col:'#ff4adf',r:{phys:1,energy:.55,blast:.8},sum:{t:'corridore',k:3,every:6}}
};
var EORDER=['fante','corridore','drone','corazzato','scudato','guaritore'];

/* ---------- dati torri ---------- */
var TW={
 cannon:{n:'Cannone',col:'#ffa43a',cost:55,kind:'phys',air:true,unl:1,
  desc:'Danno fisico. Colpisce anche i volanti. Debole contro i corazzati.',
  L:[{dmg:14,rate:1.1,range:2.4},{dmg:22,rate:1.25,range:2.6}],
  A:{n:'Perforante',d:'Colpi enormi che ignorano metà della corazza',dmg:60,rate:.95,range:3.1,pierce:.5},
  B:{n:'Mitraglia',d:'Raffica rapidissima, ottima contro gli sciami',dmg:15,rate:4.2,range:2.7}},
 laser:{n:'Laser',col:'#4cc9ff',cost:75,kind:'energy',air:true,unl:1,
  desc:'Danno energetico a raggio. Surriscalda i nemici: i colpi fisici fanno +20%. Debole contro gli scudati.',
  L:[{dmg:5,rate:5,range:2.2},{dmg:8,rate:5.5,range:2.4}],
  A:{n:'Fascio continuo',d:'Più resta sullo stesso bersaglio, più fa male (fino a x3)',dmg:9,rate:6,range:2.7,ramp:1},
  B:{n:'Prisma',d:'Il raggio rimbalza su altri 2 nemici vicini',dmg:10,rate:5,range:2.5,chain:2}},
 slow:{n:'Rallentatore',col:'#7ef0ff',cost:60,kind:'energy',air:true,unl:2,
  desc:'Rallenta tutti i nemici nel raggio. Non uccide, ma rende forti le altre torri.',
  L:[{slow:.3,dps:1.2,range:2.0},{slow:.4,dps:2.5,range:2.3}],
  A:{n:'Campo gelido',d:'Rallenta di più e i nemici rallentati subiscono +20% danni',slow:.55,dps:3,range:2.6,vuln:.2},
  B:{n:'Stasi',d:'Ogni 6 secondi blocca per 1,2 s tutti i nemici nel raggio',slow:.4,dps:3,range:2.4,freeze:1}},
 missile:{n:'Missili',col:'#ff5a6e',cost:110,kind:'blast',air:false,unl:4,
  desc:'Danno ad area, solo a terra. Lento ma devastante sui gruppi. +30% se accanto a un Rallentatore.',
  L:[{dmg:40,rate:.6,range:3.2,splash:1.0},{dmg:68,rate:.65,range:3.4,splash:1.1}],
  A:{n:'Testata pesante',d:'Un missile enorme con esplosione larghissima',dmg:170,rate:.5,range:3.6,splash:1.5},
  B:{n:'Salva',d:'Lancia 3 missili contro bersagli diversi',dmg:50,rate:.7,range:3.4,splash:.8,salvo:3}},
 radar:{n:'Radar',col:'#5dff9a',cost:80,kind:'none',air:false,unl:6,
  desc:'Non attacca: potenzia le torri vicine (danno e gittata).',
  L:[{radius:1.6,bd:.15,br:.10},{radius:1.8,bd:.25,br:.15}],
  A:{n:'Rete di comando',d:'Potenzia molto di più, anche la cadenza di fuoco',radius:2.0,bd:.40,br:.20,bf:.15},
  B:{n:'Scanner',d:'I nemici nel raggio subiscono +25% da ogni torre',radius:1.8,bd:.25,br:.15,mark:2.8}}
};
var TORDER=['cannon','laser','slow','missile','radar'];
function twAvail(k){return maxDone()>=TW[k].unl-1}

/* ---------- mondi ---------- */
var WORLDS=[
 {n:'Prato Alieno',boss:'boss1',g:'#2f6b3a',g2:'#2a6234',road:'#9a7a52',edge:'#5e4530',pad:'rgba(255,255,255,.10)',padl:'rgba(200,255,210,.40)',key:'prato',
  d:'Un prato dai colori strani vicino all’avamposto. I primi nemici sono semplici, ma presto arrivano corridori e volanti. In fondo c’è il Colosso Ruggine.'},
 {n:'Deserto di Ferro',boss:'boss2',g:'#c9a55a',g2:'#bd9a50',road:'#5a616c',edge:'#383d46',pad:'rgba(70,45,10,.16)',padl:'rgba(255,240,205,.45)',key:'deserto',
  d:'Dune e relitti di navi. Nemici più duri, scudi energetici e guaritori. Il Leviatano delle Sabbie ti aspetta alla fine.'}
];
function wOf(n){return Math.floor((n-1)/PERW)}
function lOf(n){return (n-1)%PERW+1}

/* ---------- utilità ---------- */
function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function K(c,r){return r*COLS+c}
function fmt(x){return Math.round(x)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2200)}

/* ---------- generazione mappa ---------- */
var DIRS=[[0,1],[1,0],[-1,0],[0,-1]];
function dfs(start,goal,occ,minLen,maxLen,rnd){
  var path=[start],inP={};inP[K(start[0],start[1])]=1;var budget=2500,tK=goal.cell?K(goal.cell[0],goal.cell[1]):-1;
  function free(nc,nr,prevK){
    if(nc<0||nc>=COLS||nr<0||nr>=ROWS)return false;
    var k=K(nc,nr);if(k===tK)return true;
    if(inP[k]||occ[k])return false;
    for(var i=0;i<4;i++){var a=nc+DIRS[i][0],b=nr+DIRS[i][1];if(a<0||a>=COLS||b<0||b>=ROWS)continue;var kk=K(a,b);if(kk===prevK||kk===tK)continue;if(inP[kk]||occ[kk])return false}
    return true;
  }
  function rec(c,r,pk,lc,lr){
    if(budget--<=0)return false;
    var cand=[];
    for(var i=0;i<4;i++){
      var nc=c+DIRS[i][0],nr=r+DIRS[i][1];
      if(!free(nc,nr,K(c,r)))continue;
      var k=K(nc,nr),end=false,sc=rnd();
      if(goal.bottom){
        if(nr===ROWS-1){if(path.length+1<minLen)continue;end=true}
        sc+=(DIRS[i][0]===lc&&DIRS[i][1]===lr?.55:0)+DIRS[i][1]*(path.length<minLen*.55?.2:.9);
      }else{
        if(k===tK){if(path.length+1<minLen)continue;end=true}
        var d0=Math.abs(goal.cell[0]-c)+Math.abs(goal.cell[1]-r),d1=Math.abs(goal.cell[0]-nc)+Math.abs(goal.cell[1]-nr);
        sc+=(DIRS[i][0]===lc&&DIRS[i][1]===lr?.55:0)+(d0-d1)*(.25+path.length/minLen*1.4);
      }
      cand.push({c:nc,r:nr,k:k,e:end,s:sc,d:DIRS[i]});
    }
    cand.sort(function(a,b){return b.s-a.s});
    for(var j=0;j<cand.length;j++){
      var x=cand[j];path.push([x.c,x.r]);inP[x.k]=1;
      if(x.e)return true;
      if(path.length<maxLen&&rec(x.c,x.r,K(c,r),x.d[0],x.d[1]))return true;
      path.pop();delete inP[x.k];
    }
    return false;
  }
  return rec(start[0],start[1],-1,0,1)?path:null;
}
function genMap(n){
  var base=n*7919+101;
  for(var att=0;att<600;att++){
    var rnd=rng(base+att*131),occ={},routes;
    var dbl=n>=5;
    if(!dbl){

      var tr=dfs(M,{bottom:1},occ,ROWS-M[1]+1,22,rnd);if(!tr)continue;
      tr.forEach(function(q){occ[K(q[0],q[1])]=1});
      var sa=[Math.floor(rnd()*4),0],sb=[COLS-1-Math.floor(rnd()*4),0];
      var a=dfs(sa,{cell:M},occ,9+Math.floor(n/3),40,rnd);if(!a)continue;
      a.forEach(function(q){occ[K(q[0],q[1])]=1});

function finishMap(routes,rnd){
  var path={},list=[];

  var pads={},padList=[],decor=[];

    var k=K(c,r);if(path[k])continue;

  }

function posAt(rt,d){

  return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,dx:b[0]-a[0],dy:b[1]-a[1]};
}

function waveCount(n){return 8+Math.floor((n-1)/2)}
function isBossWave(n,w){return lOf(n)===PERW&&w===waveCount(n)-1}
function bossOf(n){return WORLDS[wOf(n)].boss}
function hpMul(n,w){return (1+.09*w)*Math.pow(1.035,n-1)}
function waveSpec(n,w){
  var rnd=rng(n*1000+w*31+7),avail=EORDER.filter(function(t){return EN[t].from<=n});
  var groups=[],budget=(5+2.6*w)*(1+.05*(n-1));
  if(isBossWave(n,w)){groups.push({t:bossOf(n),k:1});budget*=.65}
  var kk=w<2?1:(w<5?2:3);kk=Math.min(kk,avail.length);
  var newest=avail[avail.length-1],chosen=[];
  if(EN[newest].from===n&&w>=2&&avail.length>1)chosen.push(newest);
  var pool=avail.slice();
  while(chosen.length<kk&&pool.length){
    var i=Math.floor(rnd()*pool.length),t=pool.splice(i,1)[0];
    if(chosen.indexOf(t)<0)chosen.push(t);
  }
  var shares=chosen.map(function(){return .35+rnd()}),tot=shares.reduce(function(a,b){return a+b},0);
  chosen.forEach(function(t,i){var k=Math.max(1,Math.round(budget*shares[i]/tot/EN[t].cost));groups.push({t:t,k:k})});
  return groups;
}
function buildSpawns(n,w,nr){
  var g=waveSpec(n,w),list=[],t=0,ctr=0;
  g.forEach(function(x){
    for(var i=0;i<x.k;i++){list.push({t:t,type:x.t,route:ctr++%nr});t+=EN[x.t].boss?0:EN[x.t].gap}
    t+=1.1;
  });
  return list;
}

function twCost(k){return Math.round(TW[k].cost*(1-.04*mv('disc')))}

  if(t.lv===2)return d.L[1];
  return d[t.br];
}
function recompute(){
  var T=S.towers;S.scan=[];

    var b=tStats(t),bd=0,br=0,bf=0,sy=[],sr=0,sd=0;

function update(dt){
  if(!S||S.over)return;
  S.time+=dt;
  /* spawn */
  if(S.spawning){
    S.waveT+=dt;
    while(S.spawn.length&&S.spawn[0].t<=S.waveT){var sp=S.spawn.shift();spawnEnemy(sp.type,0,sp.route)}
    if(!S.spawn.length){S.spawning=false;S.gold+=10+3*S.waveIdx;if(S.waveIdx<S.W)S.timer=18;}
  }else if(S.timer!==null){
    S.timer-=dt;if(S.timer<=0)startWave();
  }
  /* nemici */
  var i,e;
  for(i=0;i<S.en.length;i++){e=S.en[i];e.slow=0;e.vuln=false;e.mark=false;if(e.heat>0)e.heat-=dt;if(e.stun>0)e.stun-=dt;if(e.flash>0)e.flash-=dt}
  var T=S.towers;
  for(i=0;i<T.length;i++){
    var t=T[i];if(t.type!=='slow')continue;
    var b=tStats(t);t.anim+=dt;
    if(b.freeze){t.fz-=dt;if(t.fz<=0){t.fz=6;var hit=false;S.en.forEach(function(z){if(!z.dead&&!z.boss&&inRange(t,z)){z.stun=1.2;hit=true}});if(hit)fxRing(t.c+.5,t.r+.5,t.e.range,'#9ff')}}
    for(var j=0;j<S.en.length;j++){
      e=S.en[j];if(e.dead||e.y<-.2||!inRange(t,e))continue;
      e.slow=Math.max(e.slow,b.slow*(e.boss?.6:1));
      if(b.vuln)e.vuln=true;
      dealDamage(e,b.dps*dt*(1+.04*mv('dmg')),'energy');
    }
  }
  S.scan.forEach(function(s){S.en.forEach(function(z){if(Math.hypot(z.x-s.x,z.y-s.y)<=s.r)z.mark=true})});
  for(i=0;i<S.en.length;i++){
    e=S.en[i];if(e.dead)continue;
    var sp2=e.base*(1-clamp(e.slow,0,.8))*(e.stun>0?0:1);
    e.d+=sp2*dt;
    var P=posAt(e.rt,e.d);e.x=P.x;e.y=P.y;e.dx=P.dx;e.dy=P.dy;
    if(e.d>=e.rt.len){
      e.dead=true;e.leak=true;S.lives-=e.life;fxRing(e.x,ROWS-.4,.8,'#ff5a6e');
      if(S.lives<=0){S.lives=0;endGame(false);return}

      if(e.healT<=0){e.healT=.5;S.en.forEach(function(z){if(z!==e&&!z.dead&&Math.hypot(z.x-e.x,z.y-e.y)<=1.6&&z.hp<z.max){z.hp=Math.min(z.max,z.hp+z.max*.03);}});}
    }
    if(e.boss){

    if(!tg)continue;

    if(t2.cd>0)continue;
    var st=tStats(t2);t2.cd=1/ge.rate;

      S.pr.push({k:'b',x:t2.c+.5,y:t2.r+.5,tg:tg,sp:10,dmg:ge.dmg,pierce:st.pierce||0,col:'#ffd08a'});
    }else if(t2.type==='laser'){
      var mulr=1;
      if(st.ramp){t2.ramp=Math.min(3,t2.ramp+.0);}
      if(st.ramp){t2.rampT=(t2.rampT||0);}
      var rm=st.ramp?(1+Math.min(2,(t2.ramp)*1)):1;
      if(st.ramp)t2.ramp=Math.min(2,t2.ramp+t2.cd*.7);
      tg.heat=1.5;
      dealDamage(tg,ge.dmg*rm,'energy');

function starsFor(lost){return lost<=3?3:(lost<=9?2:1)}

      else{cx.fillStyle='#a5906a';cx.beginPath();cx.arc(0,0,.1*o.s,0,6.3);cx.fill()}

      h+='<button class="tb'+(!ok?' lk':(S.gold<cost?' no':''))+'" data-a="bld" data-v="'+k+'" '+(ok?'':'disabled')+'><img src="'+icon(k,38)+'" alt=""><span>'+d.n+'</span><span class="c">'+(ok?cost:'🔒 L'+d.unl)+'</span></button>';
    });
    h+='</div><div class="mu" style="font-size:11px;margin-top:6px;line-height:1.35" id="tdesc">Tocca una torre per costruirla. Le torri bloccate si sbloccano avanzando nei livelli.</div>';
  }else{
    var t=S.sel.t,d=TW[t.type],st=tStats(t),e=t.e;
    var title=d.n+(t.lv===3?' · '+d[t.br].n:'')+' · Liv '+t.lv;
    var dps=e.dmg*e.rate*(st.salvo||1);
    h='<div class="ti"><img src="'+icon(t.type,54)+'" alt=""><div class="d"><b>'+title+'</b><br>'+(t.lv===3?d[t.br].d:d.desc)+'</div></div>';
    if(t.type==='radar')h+='<div class="st3"><div><b>'+st.radius+'</b>raggio</div><div><b>+'+Math.round(st.bd*100)+'%</b>danno</div><div><b>+'+Math.round(st.br*100)+'%</b>gittata</div><div><b>'+(st.mark?'sì':(st.bf?'+'+Math.round(st.bf*100)+'%':'—'))+'</b>'+(st.mark?'marchio':'cadenza')+'</div></div>';
    else if(t.type==='slow')h+='<div class="st3"><div><b>'+Math.round(st.slow*100)+'%</b>rallenta</div><div><b>'+e.range.toFixed(1)+'</b>gittata</div><div><b>'+st.dps.toFixed(1)+'</b>danno/s</div><div><b>'+(st.freeze?'stasi':(st.vuln?'+20%':'—'))+'</b>'+(st.vuln?'vulnerab.':'extra')+'</div></div>';
    else h+='<div class="st3"><div><b>'+Math.round(e.dmg)+(st.salvo?'×'+st.salvo:'')+'</b>danno</div><div><b>'+e.rate.toFixed(1)+'/s</b>cadenza</div><div><b>'+e.range.toFixed(1)+'</b>gittata</div><div><b>'+Math.round(dps)+'</b>DPS</div></div>';
    if(e.syn.length)h+='<div class="syn">'+e.syn.join('<br>')+'</div>';
    if(t.lv===1)h+='<div class="row2"><button class="btn gr" data-a="up" '+(S.gold>=upCost(t)?'':'disabled')+'>Potenzia ● '+upCost(t)+'</button><button class="btn rd" data-a="sell">Vendi +'+Math.round(t.spent*.7)+'</button></div>';
    else if(t.lv===2){
      var uc=upCost(t),okc=S.gold>=uc;
      h+='<div class="br"><button class="btn gr" data-a="upA" '+(okc?'':'disabled')+'>A · '+d.A.n+' ● '+uc+'<small>'+d.A.d+'</small></button><button class="btn or" data-a="upB" '+(okc?'':'disabled')+'>B · '+d.B.n+' ● '+uc+'<small>'+d.B.d+'</small></button></div><div class="row2"><button class="btn rd" data-a="sell">Vendi +'+Math.round(t.spent*.7)+'</button></div>';
    }else h+='<div class="row2"><button class="btn" disabled>Potenziamento massimo</button><button class="btn rd" data-a="sell">Vendi +'+Math.round(t.spent*.7)+'</button></div>';
  }
  var key=h;
  if(sh.dataset.h!==key){sh.innerHTML=h;sh.dataset.h=key}
}
var lastUI=0;
function renderUI(force){
  if(!S)return;
  renderHud();renderWaveBar();
  if(force||S.uiDirty||S.time-lastUI>.25){renderSheet();lastUI=S.time;S.uiDirty=false}
}
function openLevel(n){
  closeModal();
  newGame(n);S.onEnd=showResult;
  show('game');layout();
  $('sheet').dataset.h='';$('wavebar').dataset.h='';
  renderPrev();renderUI(true);draw();
}
function showResult(res){
  var n=S.n,h;
  if(res.win){
    var stars='';for(var i=0;i<3;i++)stars+=i<res.stars?'★':'<s>★</s>';
    h='<h2 style="color:#5dff9a">Missione completata</h2><div class="stars">'+stars+'</div><p>Vite perse: '+(S.lives0-S.lives)+'</p><p class="em">+'+res.gems+' ◆ smeraldi</p>';
    if(res.unl.length)h+='<p style="color:#36e0ff;font-weight:700">Nuova torre sbloccata: '+res.unl.join(', ')+'</p>';
    if(n===NW*PERW)h+='<p>Hai difeso l’avamposto da tutti i nemici. Nuovi mondi arriveranno presto!</p>';
    h+='<div class="col">'+(n<NW*PERW?'<button class="btn pri" data-a="next">Livello successivo</button>':'')+'<button class="btn" data-a="retry">Rigioca</button><button class="btn" data-a="tolevels">Missioni</button></div>';
  }else{
    h='<h2 style="color:#ff5a6e">Avamposto caduto</h2><p>Hai resistito fino all’ondata '+S.waveIdx+' di '+S.W+'.</p><p class="mu">Prova a cambiare le torri o a sfruttare le resistenze dei nemici.</p><div class="col"><button class="btn pri" data-a="retry">Riprova</button><button class="btn" data-a="tolevels">Missioni</button></div>';
  }
  setTimeout(function(){modal(h)},res.win?500:700);
}

/* --- eventi --- */
D.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,v=b.dataset.v;
  if(a==='play'){show('levels')}
  else if(a==='upg'){show('upg')}
  else if(a==='home'){show('home')}
  else if(a==='help'){modal(helpHtml())}
  else if(a==='close'){closeModal()}
  else if(a==='world'){curW=+v;renderLevels()}
  else if(a==='lvl'){openLevel(+v)}
  else if(a==='buy'){var m=META.filter(function(x){return x.id===v})[0],lv=mv(v);if(lv<m.c.length&&save.gems>=m.c[lv]){save.gems-=m.c[lv];save.meta[v]=lv+1;persist();renderUpg()}}
  else if(a==='back'){
    if(!S||S.over){show('levels');return}
    S.paused=true;renderHud();
    modal('<h2>Pausa</h2><div class="col"><button class="btn pri" data-a="resume">Continua</button><button class="btn" data-a="retry">Ricomincia</button><button class="btn rd" data-a="quit">Esci dal livello</button></div>');
  }
  else if(a==='resume'){closeModal();if(S)S.paused=false;renderHud()}
  else if(a==='quit'){closeModal();S=null;show('levels')}
  else if(a==='retry'){openLevel(S.n)}
  else if(a==='next'){openLevel(S.n+1)}
  else if(a==='tolevels'){closeModal();curW=wOf(S.n);S=null;show('levels')}
  else if(a==='speed'){if(S)S.speed=S.speed%3+1;renderHud()}
  else if(a==='pause'){if(S&&!S.over){S.paused=!S.paused;renderHud()}}
  else if(!S)return;
  else if(a==='go'){startWave();renderPrev();S.uiDirty=true;renderUI(true)}
  else if(a==='call'){callEarly();renderPrev();S.uiDirty=true;renderUI(true)}
  else if(a==='bld'&&S.sel&&S.sel.pad){
    var t=build(S.sel.c,S.sel.r,v);
    if(t){S.sel={t:t};S.uiDirty=true;renderUI(true)}else{toast(S.gold<twCost(v)?'Oro insufficiente':'Non puoi costruire qui')}
  }
  else if(a==='up'&&S.sel&&S.sel.t){if(upgrade(S.sel.t)){S.uiDirty=true;renderUI(true)}}
  else if((a==='upA'||a==='upB')&&S.sel&&S.sel.t){if(upgrade(S.sel.t,a==='upA'?'A':'B')){S.uiDirty=true;renderUI(true)}}
  else if(a==='sell'&&S.sel&&S.sel.t){sell(S.sel.t);S.uiDirty=true;renderUI(true)}
});
cv.addEventListener('pointerdown',function(ev){
  if(!S||S.over)return;
  var r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/CELL,y=(ev.clientY-r.top)/CELL,c=Math.floor(x),rw=Math.floor(y);
  var t=tAt(c,rw);
  if(t)S.sel={t:t};
  else if(S.map.pads[K(c,rw)])S.sel={pad:true,c:c,r:rw};
  else S.sel=null;
  S.uiDirty=true;renderUI(true);
});
D.addEventListener('visibilitychange',function(){if(D.hidden&&S&&!S.over)S.paused=true})

/* --- ciclo --- */
var last=0;
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(S&&scrNow==='game'){
    if(!S.paused&&!S.over){for(var i=0;i<S.speed;i++)update(dt)}
    draw();renderUI(false);
    if(S.timer!==null&&!S.spawning&&Math.ceil(S.timer)!==S.lastSec){S.lastSec=Math.ceil(S.timer)}
    if(S.waveIdx!==S.prevWave){S.prevWave=S.waveIdx;renderPrev()}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
show('home');
if(!save.help){save.help=1;persist();setTimeout(function(){modal(helpHtml())},400)}

})();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){var hadC=!!navigator.serviceWorker.controller,rl=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadC&&!rl){rl=true;location.reload()}});navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){r.update();document.addEventListener("visibilitychange",function(){if(!document.hidden)r.update()})}).catch(function(){})}
