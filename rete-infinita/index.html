<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0e14">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#0a0e14;--pn:#111925;--pn2:#18222f;--ln:#26364a;--am:#ffc23a;--am2:#ff9d2e;--cy:#4cc9ff;--gr:#62e69a;--rd:#ff6b6b;--tx:#e8eef7;--mu:#8497b0;--vi:#b48cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#top{padding:calc(env(safe-area-inset-top) + 44px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--ln);text-align:center}
#top .ch{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
#top .en{font-size:30px;font-weight:800;color:var(--am);line-height:1.15}
#top .rt{font-size:13px;color:var(--mu)}
#top .rt b{color:var(--tx)}
#top .kd{font-size:11px;color:var(--vi);margin-top:2px}
#main{flex:1;overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch}
#tabs{display:flex;border-top:1px solid var(--ln);background:var(--pn);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:12px 4px 10px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);position:relative}
#tabs button.on{color:var(--am)}
#tabs button.on::after{content:"";position:absolute;left:25%;right:25%;top:0;height:2px;background:var(--am)}
#tabs button .dot{position:absolute;top:8px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--gr)}
.btn{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.am{background:linear-gradient(180deg,#ffcb55,#e8962a);border-color:#ffe08a;color:#1c1100}
.btn.gr{background:linear-gradient(180deg,#4fdc8e,#2a9d62);border-color:#8bf0b6;color:#04170c}
.btn.vi{background:linear-gradient(180deg,#a37cf5,#6b46c9);border-color:#c8b0ff;color:#fff}
.btn[disabled]{opacity:.38;pointer-events:none}
#clk{width:100%;padding:16px;font-size:16px;margin-bottom:10px;letter-spacing:.04em}
.modes{display:flex;gap:6px;margin-bottom:10px}
.modes button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--ln);background:var(--pn);font-size:12px;font-weight:700;color:var(--mu)}
.modes button.on{background:var(--pn2);color:var(--am);border-color:var(--am)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.gen{display:flex;gap:10px;align-items:center}
.gen .inf{flex:1;min-width:0}
.gen .nm{font-weight:800;font-size:15px}
.gen .nm i{font-style:normal;color:var(--am);font-weight:700;font-size:13px;margin-left:6px}
.gen .ds{font-size:11.5px;color:var(--mu);line-height:1.3;margin-top:2px}
.gen .pr{font-size:12px;color:var(--cy);margin-top:3px}
.gen .by{min-width:98px;text-align:center;padding:9px 6px;line-height:1.25}
.gen .by small{display:block;font-size:11px;font-weight:600;opacity:.85}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:14px 2px 6px}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.res span{background:var(--pn2);border:1px solid var(--ln);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700}
.bar{height:8px;background:#1c2938;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr));width:0}
.rs{display:flex;gap:10px;align-items:center}
.rs .inf{flex:1}.rs .nm{font-weight:800;font-size:14px}.rs .ds{font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.3}
.rs .by{min-width:86px;padding:9px 6px;text-align:center;font-size:13px}
.done{opacity:.55}
.lock{opacity:.4;text-align:center;font-size:13px;color:var(--mu);padding:14px}
.pb{display:block;width:100%;text-align:left;margin-bottom:8px}
.pb small{display:block;font-weight:500;font-size:11.5px;opacity:.8;margin-top:2px;line-height:1.3}
.pips{display:flex;gap:4px;margin-top:5px}.pips i{width:16px;height:5px;border-radius:3px;background:#243246}.pips i.f{background:var(--vi)}
#modal{position:fixed;inset:0;background:rgba(3,6,10,.8);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
#modal.on{display:flex}
#modal .box{background:linear-gradient(180deg,#16212f,#0d141d);border:1px solid var(--ln);border-radius:18px;padding:20px 18px;width:100%;max-width:350px;max-height:86vh;overflow:auto;text-align:center}
#modal h2{margin:0 0 8px;font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--am)}
#modal p{font-size:14px;line-height:1.5;margin:8px 0;color:#d3dcea}
#modal .col{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);background:#18222f;border:1px solid var(--am);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;z-index:30;display:none;max-width:88%;text-align:center}
.mu{color:var(--mu)}.am{color:var(--am)}.vi{color:var(--vi)}
.log{font-size:12.5px;line-height:1.5;color:#b9c6d8}
.log p{margin:0 0 9px;padding-left:10px;border-left:2px solid var(--ln)}
input,textarea{width:100%;background:#0c121a;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px;font:12px monospace}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div class="ch" id="tch"></div><div class="en" id="ten"></div><div class="rt" id="trt"></div><div class="kd" id="tkd"></div></div>
 <div id="main"></div>
 <div id="tabs"></div>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};

/* ================= NUMERI ENORMI (mantissa + esponente) ================= */
function N(m,e){this.m=m;this.e=e}
function norm(m,e){
  if(m===0||m!==m)return new N(0,0);
  var a=Math.abs(m),k=Math.floor(Math.log10(a));
  m/=Math.pow(10,k);e+=k;
  if(Math.abs(m)>=10){m/=10;e++}else if(Math.abs(m)<1){m*=10;e--}
  return new N(m,e);
}
var Z=new N(0,0);
function n(x){return x instanceof N?x:(x===0?Z:norm(x,0))}
function add(a,b){a=n(a);b=n(b);if(!a.m)return b;if(!b.m)return a;
  if(a.e<b.e){var t=a;a=b;b=t}
  var d=a.e-b.e;if(d>16)return a;
  return norm(a.m+b.m*Math.pow(10,-d),a.e)}
function neg(a){a=n(a);return new N(-a.m,a.e)}
function sub(a,b){return add(a,neg(b))}
function mul(a,b){a=n(a);b=n(b);return norm(a.m*b.m,a.e+b.e)}
function div(a,b){a=n(a);b=n(b);return norm(a.m/b.m,a.e-b.e)}
function cmp(a,b){a=n(a);b=n(b);
  if(!a.m&&!b.m)return 0;
  if(a.m>0&&b.m<=0)return 1;if(a.m<=0&&b.m>0)return -1;
  if(!a.m)return b.m>0?-1:1;if(!b.m)return a.m>0?1:-1;
  var s=a.m>0?1:-1;
  if(a.e!==b.e)return (a.e>b.e?1:-1)*s;
  return a.m===b.m?0:(a.m>b.m?1:-1)}
function gte(a,b){return cmp(a,b)>=0}
function lg(a){a=n(a);return a.m>0?Math.log10(a.m)+a.e:-Infinity}
function pw(a,x){a=n(a);if(!a.m)return Z;var l=(Math.log10(a.m)+a.e)*x,e=Math.floor(l);return norm(Math.pow(10,l-e),e)}
function p10(x){var e=Math.floor(x);return norm(Math.pow(10,x-e),e)}
function toNum(a){a=n(a);return a.m*Math.pow(10,a.e)}
function floor(a){a=n(a);return a.e>=15?a:norm(Math.floor(toNum(a)+1e-9),0)}
function mx(a,b){return cmp(a,b)>=0?n(a):n(b)}
function mn(a,b){return cmp(a,b)<=0?n(a):n(b)}
function ser(a){a=n(a);return a.m+'e'+a.e}
function par(s){if(s instanceof N)return s;if(typeof s==='number')return n(s);if(typeof s!=='string')return Z;var i=s.indexOf('e');if(i<0)return n(parseFloat(s)||0);return norm(parseFloat(s.slice(0,i))||0,parseInt(s.slice(i+1))||0)}
function fmt(a,dec){
  a=n(a);if(!a.m)return '0';
  if(a.e<6){
    var v=toNum(a);
    if(a.e<3)return (Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):v.toFixed(dec===undefined?(a.e<1?2:1):dec)).replace('.',',');
    return Math.floor(v).toLocaleString('it-IT');
  }
  return a.m.toFixed(2).replace('.',',')+'e'+a.e;
}
function fmtT(sec){sec=Math.max(0,Math.floor(sec));var d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d)return d+'g '+h+'h';if(h)return h+'h '+m+'m';if(m)return m+'m '+(sec%60)+'s';return sec+'s'}

/* ================= DATI DI GIOCO ================= */
var CHAP=[
 {n:'Rinnovabili',at:0,tx:'Un tetto, un pannello, un contatore che gira all’indietro. Ogni grande rete è partita da un solo kilowatt. Il tuo.'},
 {n:'Centrali',at:6e3,tx:'Il sole non basta più. Servono turbine che non dormono mai: gas e, soprattutto, uranio. Le miniere iniziano a produrre Combustibile, e il nucleare ne trae potenza.'},
 {n:'Ricerca',at:3e6,tx:'Non si può crescere solo comprando: bisogna capire. Aprono i laboratori, che producono Dati per sbloccare tecnologie permanenti. Nasce anche la rete intelligente.'},
 {n:'Fusione',at:2e10,tx:'La stella in bottiglia. I reattori a fusione rendono enormemente, ma bruciano Deuterio: se il serbatoio si svuota, la potenza crolla. Bilancia estrattori e reattori.'},
 {n:'Orbita',at:5e13,tx:'La rete sale in cielo. I satelliti solari seguono il ciclo giorno-notte dell’orbita e la loro resa oscilla. Con la ricerca potrai stabilizzarla.'},
 {n:'Stella',at:5e17,tx:'Costruire una sfera attorno al Sole. I raccoglitori estraggono Materia dagli asteroidi: i segmenti di Dyson si pagano con quella, non con l’energia.'},
 {n:'Galassia',at:5e22,tx:'La civiltà diventa una questione di scala. Ogni passo sulla scala di Kardashev moltiplica tutta la produzione. Oltre non c’è un limite: solo numeri.'}
];
var GR={r:'Rinnovabili',c:'Centrali',s:'Rete',f:'Fusione',o:'Orbita',d:'Dyson',g:'Galassia'};
/* type: e=energia, comb, dati, deut, mat | cur: e | mat */
var G=[
 {id:'pan',n:'Pannello solare',ch:0,c:15,g:1.15,p:.2,t:'e',gr:'r',ds:'Silicio e luce: il punto di partenza.'},
 {id:'eol',n:'Turbina eolica',ch:0,c:150,g:1.15,p:1.8,t:'e',gr:'r',ds:'Pale sulla cresta della collina.'},
 {id:'dig',n:'Diga idroelettrica',ch:0,c:2e3,g:1.16,p:20,t:'e',gr:'r',ds:'Un fiume intero a lavorare per te.'},
 {id:'gas',n:'Centrale a gas',ch:1,c:3e4,g:1.16,p:260,t:'e',gr:'c',ds:'Veloce da accendere. Sensibile al Combustibile.'},
 {id:'min',n:'Miniera di uranio',ch:1,c:2e5,g:1.17,p:1,t:'comb',gr:'c',ds:'Produce Combustibile, che potenzia le centrali.'},
 {id:'nuc',n:'Centrale nucleare',ch:1,c:1.5e6,g:1.17,p:3800,t:'e',gr:'c',ds:'Densità enorme. Cresce col Combustibile.'},
 {id:'lab',n:'Laboratorio',ch:2,c:2e7,g:1.18,p:1,t:'dati',gr:'s',ds:'Produce Dati per la ricerca.'},
 {id:'sma',n:'Rete intelligente',ch:2,c:1.5e8,g:1.18,p:55e3,t:'e',gr:'s',ds:'Smista l’energia dove serve, quando serve.'},
 {id:'est',n:'Estrattore di Deuterio',ch:3,c:1e10,g:1.19,p:1,t:'deut',gr:'f',ds:'Separa il Deuterio dall’acqua di mare.'},
 {id:'fus',n:'Reattore a fusione',ch:3,c:8e10,g:1.19,p:1.1e6,t:'e',gr:'f',ds:'Consuma 0,5 Deuterio/s ciascuno.'},
 {id:'sat',n:'Satellite solare',ch:4,c:2e13,g:1.2,p:2.4e7,t:'e',gr:'o',ds:'La resa oscilla con l’orbita (90 s).'},
 {id:'sta',n:'Stazione orbitale',ch:4,c:3e15,g:1.2,p:4e8,t:'e',gr:'o',ds:'Resa costante, qualunque sia l’ora.'},
 {id:'ast',n:'Raccoglitore di asteroidi',ch:5,c:4e17,g:1.2,p:1,t:'mat',gr:'d',ds:'Produce Materia per i segmenti di Dyson.'},
 {id:'dys',n:'Segmento di Dyson',ch:5,c:60,cur:'mat',g:1.28,p:1.5e10,t:'e',gr:'d',ds:'Si paga in Materia. Un frammento di stella intrappolato.'},
 {id:'str',n:'Stella imbrigliata',ch:6,c:5e22,g:1.22,p:6e12,t:'e',gr:'g',ds:'Una stella intera, tutta tua.'},
 {id:'gal',n:'Nucleo galattico',ch:6,c:2e28,g:1.23,p:5e15,t:'e',gr:'g',ds:'Il cuore di una galassia, domato.'}
];
var GI={};G.forEach(function(g){GI[g.id]=g});
var RES=[
 {id:'r1',n:'Celle fotovoltaiche migliori',c:40,d:'Rinnovabili ×2',e:{gr:'r',m:2}},
 {id:'r2',n:'Pale aerodinamiche',c:200,d:'Rinnovabili ×2',e:{gr:'r',m:2}},
 {id:'r3',n:'Turbine reversibili',c:800,d:'Rinnovabili ×3',e:{gr:'r',m:3}},
 {id:'r4',n:'Reattori di IV generazione',c:3e3,d:'Centrali ×2',e:{gr:'c',m:2}},
 {id:'r5',n:'Sicurezza passiva',c:1.2e4,d:'Centrali ×2',e:{gr:'c',m:2}},
 {id:'r6',n:'Magneti superconduttori',c:6e4,d:'Tutta la produzione ×1,5',e:{gl:1.5}},
 {id:'r7',n:'Plasma stabile',c:3e5,d:'Fusione ×3',e:{gr:'f',m:3}},
 {id:'r8',n:'Stabilizzatore orbitale I',c:2e6,d:'Oscillazione orbitale −33%',e:{orb:.6}},
 {id:'r9',n:'Stabilizzatore orbitale II',c:1.5e7,d:'Oscillazione orbitale −66%',e:{orb:.3}},
 {id:'r10',n:'Stabilizzatore orbitale III',c:1e8,d:'Resa orbitale costante, +50%',e:{orb:0,gr:'o',m:1.5}},
 {id:'r11',n:'Nanomateriali',c:5e8,d:'Dyson ×3',e:{gr:'d',m:3}},
 {id:'r12',n:'Logistica di rete',c:5e9,d:'Tutta la produzione ×2',e:{gl:2}},
 {id:'r13',n:'Calcolo quantistico',c:1e11,d:'Tutta la produzione ×3',e:{gl:3}},
 {id:'r14',n:'Memoria galattica',c:5e12,d:'Galassia ×4',e:{gr:'g',m:4}},
 {id:'r15',n:'Algoritmi di previsione',c:2e14,d:'Tutta la produzione ×5',e:{gl:5}}
];
var SH=[
 {id:'fon',n:'Fondi di avvio',d:'Ogni run inizia con energia già pronta',c:[1,3,10,40,200],f:function(l){return[0,2e3,1e5,1e7,1e9,1e11][l]}},

 {id:'cap',n:'Memoria della rete',d:'Ogni run parte con più capitoli già sbloccati',c:[3,12,50,250,1500,10000]},
 {id:'ric',n:'Archivio storico',d:'Ogni run inizia con 2 ricerche per livello già fatte',c:[5,25,150,1000,8000],pre:'cap'},
 {id:'a1',n:'Automazione I',d:'Acquista da solo Rinnovabili e Centrali',c:[8]},
 {id:'a2',n:'Automazione II',d:'Acquista da solo Rete e Fusione',c:[60],pre:'a1'},
 {id:'a3',n:'Automazione III',d:'Acquista da solo Orbita e Dyson',c:[600],pre:'a2'},
 {id:'a4',n:'Automazione IV',d:'Acquista da solo la Galassia',c:[8000],pre:'a3'},
 {id:'cos',n:'Logistica',d:'I costi dei generatori crescono più lentamente',c:[4,20,120,900,8000]},
 {id:'off',n:'Accumulatori',d:'Più ore di offline e resa migliore',c:[2,10,60,400,3000]},
 {id:'clk',n:'Impulso manuale',d:'Ogni tocco vale di più (% della produzione)',c:[1,5,30,200,2000]},
 {id:'crd',n:'Mercato dei crediti',d:'Crediti guadagnati ×1,5 per livello',c:[10,60,400,3000,25000,2e5],pre:'rin'},
 {id:'ms',n:'Calibrazione',d:'I traguardi di quantità valgono di più (×2 → ×2,5 → ×3 → ×3,5)',c:[100,2000,50000],pre:'pro'},

];
var SI={};SH.forEach(function(s){SI[s.id]=s});
var PRESTIGE_BASE=1e11;

/* ================= STATO ================= */
var KEY='rete-infinita-v1';
function fresh(){return{v:1,e:n(10),tot:Z,ok:Z,comb:Z,dati:Z,deut:Z,mat:Z,n:{},res:{},chap:0,rt:0,
  cr:Z,crL:Z,pres:0,shop:{},mode:1,seen:{},t0:Date.now(),ps:0,last:Date.now(),played:0,tab:'gen',best:Z,log:[]}}
var S=fresh();
function sl(id){return S.shop[id]|0}
function cnt(id){return S.n[id]||Z}
function startEnergy(){var l=sl('fon');return n(SH[0].f(l)+10)}

function save(){
  try{
    var o={v:1,e:ser(S.e),tot:ser(S.tot),ok:ser(S.ok),comb:ser(S.comb),dati:ser(S.dati),deut:ser(S.deut),mat:ser(S.mat),n:{},res:S.res,chap:S.chap,rt:S.rt,
      cr:ser(S.cr),crL:ser(S.crL),pres:S.pres,shop:S.shop,mode:S.mode,seen:S.seen,t0:S.t0,played:S.played,tab:S.tab,best:ser(S.best),log:S.log.slice(-30),last:Date.now()};
    for(var k in S.n)o.n[k]=ser(S.n[k]);
    localStorage.setItem(KEY,JSON.stringify(o));
  }catch(e){}
}
function load(raw){
  try{
    var o=JSON.parse(raw||localStorage.getItem(KEY));if(!o||o.v!==1)return false;
    var s=fresh();
    ['e','tot','ok','comb','dati','deut','mat','cr','crL','best'].forEach(function(k){s[k]=par(o[k])});
    s.n={};for(var k in o.n||{})s.n[k]=par(o.n[k]);
    s.res=o.res||{};s.chap=o.chap|0;s.rt=o.rt||0;s.pres=o.pres|0;s.shop=o.shop||{};s.mode=o.mode||1;s.seen=o.seen||{};
    s.t0=o.t0||Date.now();s.played=o.played||0;s.tab=o.tab||'gen';s.log=o.log||[];s.last=o.last||Date.now();
    S=s;return true;
  }catch(e){return false}
}

/* ================= CALCOLO PRODUZIONE ================= */
var msBase=function(){return 2+.5*sl('ms')};
function msMul(c){var x=toNum(c);if(x<10)return 1;var k=x<25?1:(x<50?2:3+Math.floor(Math.log2(x/50)));return Math.pow(msBase(),k)}
function resBonus(gr){var m=1;RES.forEach(function(r){if(S.res[r.id]&&r.e.gr===gr&&r.e.m)m*=r.e.m});return m}
function resGlobal(){var m=1;RES.forEach(function(r){if(S.res[r.id]&&r.e.gl)m*=r.e.gl});return m}
function orbAmp(){var a=.9;RES.forEach(function(r){if(S.res[r.id]&&r.e.orb!==undefined)a=Math.min(a,r.e.orb)});var l=sl('orb');if(l)a*=Math.pow(.5,l);return a}
function presMult(){return pw(add(1,S.crL),.9)}
function kard(P){var L=lg(P);return L===-Infinity?0:(L-6)/10}
function kardMult(P){if(S.chap<6)return 1;var k=Math.max(0,kard(P));return Math.pow(1.5,Math.floor(k*4))}
var C_={};
function calc(){
  var A={},glob=mul(mul(presMult(),Math.pow(1.5,sl('pro'))),resGlobal());
  var comb=1+Math.log10(1+toNum(S.comb)>1e300?1e300:1+toNum(S.comb));
  var fusN=cnt('fus'),estN=cnt('est');
  var dprod=mul(mul(estN,msMul(estN)),1),dcons=mul(fusN,.5);
  var fe=1;
  if(S.deut.m<=0||cmp(S.deut,1e-9)<0)fe=cmp(dcons,0)>0?Math.min(1,toNum(div(dprod,dcons))):1;
  var orb=1+orbAmp()*Math.sin(2*Math.PI*S.rt/90);
  var total=Z,rates={};
  G.forEach(function(g){
    var c=cnt(g.id);if(!c.m)return;
    var base=mul(mul(c,g.p),msMul(c));
    var m=n(1);
    if(g.t==='e'){
      m=mul(m,resBonus(g.gr));
      if(g.gr==='r')m=mul(m,Math.pow(2,sl('rin')));
      if(g.gr==='c')m=mul(m,comb);
      if(g.id==='fus')m=mul(m,fe);
      if(g.id==='sat')m=mul(m,orb);
      m=mul(m,glob);
      var r=mul(base,m);rates[g.id]=r;total=add(total,r);
    }else{
      rates[g.id]=mul(base,glob.m>0?1:1);
    }
  });

/* ================= COSTI ================= */
function gg(g){return 1+(g.g-1)*(1-.06*sl('cos'))}
function costN(g,k){ // costo di k unita'
  var gr=gg(g),own=cnt(g.id),b=mul(g.c,pw(gr,toNum(own)));
  return mul(b,div(sub(pw(gr,k),1),gr-1));
}
function wallet(g){return g.cur==='mat'?S.mat:S.e}
function maxBuy(g){
  var gr=gg(g),own=cnt(g.id),b=mul(g.c,pw(gr,toNum(own)));
  var x=div(mul(wallet(g),gr-1),b);
  if(cmp(x,1e-12)<0)return 0;
  var k=Math.floor(Math.log10(1+toNum(x))/Math.log10(gr)+1e-9);
  if(!isFinite(k))k=Math.floor(lg(x)/Math.log10(gr));
  return Math.max(0,k);
}
function buy(id,mode,frac){
  var g=GI[id],k=mode==='max'?maxBuy(g):mode;
  if(mode!=='max'&&cmp(costN(g,k),wallet(g))>0)return 0;
  if(k<=0)return 0;
  var c=costN(g,k);
  if(g.cur==='mat')S.mat=mx(0,sub(S.mat,c));else S.e=mx(0,sub(S.e,c));
  S.n[id]=add(cnt(id),k);return k;
}

/* ================= TICK ================= */
function chapterCheck(){
  var changed=false;
  for(var i=S.chap+1;i<CHAP.length;i++){if(gte(S.tot,CHAP[i].at)){S.chap=i;changed=true}else break}
  return changed;
}
function tick(dt,quiet){
  S.rt+=dt;S.played+=dt;
  var A=calc();
  var ge=mul(A.total,dt);S.e=add(S.e,ge);S.tot=add(S.tot,ge);S.ok=add(S.ok,ge);
  if(cmp(S.tot,S.best)>0)S.best=S.tot;
  S.comb=add(S.comb,mul(A.combR,dt));S.dati=add(S.dati,mul(A.dati,dt));S.mat=add(S.mat,mul(A.mat,dt));
  var dd=sub(A.dprod,A.dcons);S.deut=mx(0,add(S.deut,mul(dd,dt)));
  var ch=chapterCheck();

  return ch;
}
function autoLevel(g){var c=g.ch;if(c<=1)return sl('a1')>0;if(c<=3)return sl('a2')>0;if(c<=5)return sl('a3')>0;return sl('a4')>0}
var abT=0;
function autobuy(){
  var order=G.slice().reverse();
  for(var i=0;i<order.length;i++){
    var g=order[i];if(g.ch>S.chap||!autoLevel(g))continue;
    if(g.t==='e'&&g.cur!=='mat'||g.t!=='e'||g.cur==='mat'){
      var w=wallet(g),save_=w;
      var cost1=costN(g,1);if(cmp(cost1,mul(w,.5))>0)continue;
      var gr=gg(g),own=cnt(g.id),b=mul(g.c,pw(gr,toNum(own)));
      var x=div(mul(mul(w,.35),gr-1),b);
      var k=Math.floor(Math.log10(1+toNum(x))/Math.log10(gr));
      if(k<1)k=1;
      if(cmp(costN(g,k),w)>0)k=1;
      buy(g.id,k);
    }
  }
}
