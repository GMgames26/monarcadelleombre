<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monarca delle Ombre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070912">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monarca">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow "System window" column, bottom tab bar, combat takes over the column. Dark world by choice. */
:root{--bg:#070912;--panel:#0d1226;--panel2:#141c3d;--line:#26356f;--accent:#4aa8ff;--violet:#9266ff;--fg:#e2e8ff;--muted:#8c98c6;--danger:#ff5472;--good:#3ddc97;--gold:#f2c14e;--display:"Chakra Petch",system-ui,sans-serif;--body:"Barlow",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);touch-action:manipulation;-webkit-text-size-adjust:100%}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:22px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
#app{max-width:560px;margin:0 auto}
button{font-family:inherit}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:14px}
.rk{width:52px;height:52px;border:2px solid var(--rk);color:var(--rk);display:grid;place-items:center;font:700 30px var(--display);border-radius:4px}
.who{min-width:0}
.nm{font:600 17px var(--display);letter-spacing:.03em}
.nm span{color:var(--accent);margin-left:6px;font-size:14px}
.sm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.gold{font:700 18px var(--display);color:var(--gold);text-align:right;font-variant-numeric:tabular-nums}
.gold small.syn{font:500 10px var(--body);letter-spacing:0;text-transform:none;margin-top:3px}
.gold small{display:block;font:500 10px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px;min-width:0}
.lbl{font:600 11px var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.lbl em{font-style:normal;color:var(--muted)}
.bar{height:8px;background:#0a0f22;border:1px solid #1d2a5c;border-radius:2px;overflow:hidden;margin-top:3px}
.bar.big{height:12px}
.bar i{display:block;height:100%;transition:width .3s}
.hp{background:linear-gradient(90deg,#e63e62,#ff7a8f)}
.mp{background:linear-gradient(90deg,#2a6cff,#4aa8ff)}
.xp{background:linear-gradient(90deg,#6a3df0,#a885ff)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0}
.row+.row{border-top:1px solid #1a2552}
.grow{flex:1;min-width:0}
.rn{font:600 15px var(--display);letter-spacing:.02em}
.val{font:700 20px var(--display);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.btn{font:600 13px var(--display);letter-spacing:.07em;text-transform:uppercase;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:3px;min-height:46px;padding:8px 12px;cursor:pointer;line-height:1.2}
.btn small{display:block;font:500 10px var(--body);letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:2px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:linear-gradient(180deg,#2c6fff,#1b49c9);border-color:#5b95ff}
.btn.gld{border-color:#8a6a1f;color:var(--gold)}
.btn.dng{border-color:#7a2a3b;color:var(--danger)}
.btn.sq{width:46px;padding:0;font-size:20px}
.btn.full{width:100%}
.btn.sm2{min-height:38px;padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.38;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--panel2);border-radius:3px;padding:8px 6px;text-align:center}
.cell b{display:block;font:700 17px var(--display);font-variant-numeric:tabular-nums}
.cell span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{border-color:#3a4f9e;background:linear-gradient(180deg,#111a3c,var(--panel))}
.hint p{margin:0 0 6px}
.gate{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;color:var(--fg)}
.gate .g{width:46px;height:46px;border:2px solid var(--rk);color:var(--rk);display:grid;place-items:center;font:700 25px var(--display);border-radius:4px;text-shadow:0 0 12px var(--rk)}
.gate .gt{font:600 15px var(--display);letter-spacing:.03em}
.gate.lock{opacity:.45}
.gate button{grid-column:1/-1}
.tag{display:inline-block;font:700 10px var(--display);letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;border-radius:2px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.tag.boss{color:var(--danger)}
.tag.warn{color:var(--gold)}
.tag.vio{color:var(--violet)}
.tag.cls{color:var(--cc)}
.enemy{text-align:center;padding:10px 6px 6px}
.enemy .en{font:700 19px var(--display);margin-bottom:8px;letter-spacing:.02em}
.enemy.hit{animation:shake .28s}
.enemy.dead{opacity:.35}
.ally{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ally>div{min-width:0}
.ally .n{font:600 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ally .down{opacity:.4}
.ally .me.hit{animation:shake .28s}
.log{height:152px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.enemy{min-height:112px}
.enemy .en{min-height:2.4em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 0}
#actbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0a0e20;border-top:1px solid var(--line);max-height:62vh;overflow-y:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#actbar>div{max-width:560px;margin:0 auto}
#actbar .panel{margin:0}
#actbar .acts{grid-template-columns:repeat(4,1fr);gap:6px}
#actbar .acts .btn{min-height:56px;padding:6px 3px;font-size:11px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lg{font-size:13px;padding:2px 0;color:var(--muted)}
.lg.hit{color:var(--fg)}
.lg.shadow{color:#b79cff}
.lg.good{color:var(--good)}
.lg.bad{color:var(--danger)}
.lg:last-child{color:var(--fg)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arise{text-align:center;border-color:#5b3fc0;background:linear-gradient(180deg,#171040,var(--panel))}
.arise .big{font:700 20px var(--display);margin:0 0 4px}
.arisebtn{width:100%;min-height:62px;font-size:24px;letter-spacing:.3em;color:#fff;background:linear-gradient(180deg,#7a4bff,#4a24c8);border-color:#9d7dff;animation:pulse 1.8s ease-in-out infinite;margin:12px 0 8px}
.full-warn{border:1px solid #8a6a1f;background:#1b1708;color:var(--gold);border-radius:3px;padding:8px 10px;font-size:13px;margin:10px 0 0;text-align:left}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.sum span:nth-child(even){text-align:right;font-weight:600}
.cap{display:flex;gap:6px;margin:2px 0 4px}
.cap i{flex:1;height:8px;border-radius:2px;background:#0a0f22;border:1px solid #1d2a5c}
.cap i.f{background:var(--violet);border-color:var(--violet)}
.qrow{padding:4px 0}
.qrow+.qrow{border-top:1px solid #1a2552}
.qrow .t{display:flex;justify-content:space-between;gap:8px;font:600 13px var(--display)}
.qrow .t.ok{color:var(--good)}
.qrow .d{font-size:13px;color:var(--muted);margin:2px 0 4px}
.qrow .rw{font-size:12px;color:var(--gold);margin:6px 0 8px;font-variant-numeric:tabular-nums}
.qc{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0}
.qc+.qc{border-top:1px solid #1a2552}
.qc .qi{min-width:0}
.qc .t{display:flex;justify-content:space-between;gap:8px;font:600 14px var(--display)}
.qc .t.ok{color:var(--good)}
.qc .d{font-size:12px;color:var(--muted);margin:1px 0 0}
.qc .rw{font-size:11px;color:var(--gold);margin-top:3px;font-variant-numeric:tabular-nums}
.qc .bar{height:5px;margin-top:4px}
.qc .btn{min-width:84px}
.qc.fin{opacity:.5;padding:6px 0}
.qc.fin .t{font-size:13px}
.loot{text-align:left;margin:0 0 14px;padding:10px 12px;background:var(--panel2);border-radius:3px}
.loot div{font-size:13px;padding:2px 0}
.loot div.rare{color:var(--gold);font-weight:600}
.tb{padding:8px 0;border-top:1px solid #1a2552}.tbh{font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:3px}.tn{font-size:12px;color:var(--muted);margin:2px 0}.tn.on{color:var(--good)}.tn.nx{color:var(--fg)}.tn b{color:var(--gold);font-weight:600}
.tree{padding:10px 8px}.trow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:0}.thead div{text-align:center;font:700 10px var(--display);letter-spacing:.14em;text-transform:uppercase;padding-bottom:6px}.tcell{position:relative;padding-top:10px}.tcell .tl{position:absolute;left:50%;top:0;width:2px;height:10px;background:#1d2a5c;transform:translateX(-1px)}.tcell .tl.on{background:var(--bc)}.tn2{width:100%;min-height:42px;border:1px solid #1d2a5c;border-radius:6px;background:#0a0f22;color:#4a5584;font:600 10.5px/1.25 var(--display);padding:4px 3px;cursor:pointer}.tn2.nxt{border-color:var(--bc);color:var(--fg);box-shadow:0 0 0 1px var(--bc) inset}.tn2.own{background:#151c44;border-color:var(--bc);color:var(--bc)}.tn2.sel{outline:2px solid var(--fg);outline-offset:1px}.tcell.root{grid-column:2}.tn2.rootn{min-height:46px}.tjoin{height:10px;margin:10px 18% 0;border:2px solid #1d2a5c;border-bottom:0;border-radius:6px 6px 0 0}.tjoin.on{border-color:#e8ecff}
#nav{grid-template-columns:repeat(6,1fr)!important}#nav button{font-size:10px;letter-spacing:.03em}
.warnbox{font-size:12px;color:var(--muted);margin:6px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:600 13px var(--display);letter-spacing:.06em;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:3px;min-height:40px;min-width:44px;padding:6px 12px;cursor:pointer}
.chip.on{color:var(--fg);border-color:var(--cc,var(--accent));box-shadow:inset 0 -2px 0 var(--cc,var(--accent))}
.chip:disabled{opacity:.35;cursor:not-allowed}
.shadowcard{--cc:var(--accent)}
.shadowcard .nm{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 0;align-items:center}
.btns{display:flex;gap:8px;margin-top:8px}
.btns .btn{flex:1;min-height:42px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.slot{text-align:left;background:var(--panel2);border:1px solid #1f2b60;border-radius:3px;padding:8px 10px;color:var(--fg);cursor:pointer;min-width:0;min-height:54px}
.slot.on{border-color:var(--accent)}
.slot b{display:block;font:600 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.slot span{display:block;font-size:13px;overflow-wrap:anywhere}
.slot.empty span{color:#5a679c}
.pick{background:#0a0f22;border:1px solid #1d2a5c;border-radius:3px;padding:8px 10px;margin-top:8px}
.pick .row{padding:8px 0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;font-variant-numeric:tabular-nums;margin:8px 0}
.pend{--cc:var(--violet);text-align:left;background:#120d33;border:1px solid #5b3fc0;border-radius:3px;padding:10px 12px;margin:10px 0}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#0a0e20;border-top:1px solid var(--line);padding:0 max(6px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-right,0px))}
#nav button{background:none;border:0;color:var(--muted);font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;min-height:58px;position:relative;cursor:pointer}
#nav button.on{color:var(--fg);box-shadow:inset 0 2px 0 var(--accent)}
#nav button.dot::after{content:"";position:absolute;top:12px;left:calc(50% + 22px);width:7px;height:7px;border-radius:50%;background:var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar-h,64px) + 12px + env(safe-area-inset-bottom,0px));background:#10183a;border:1px solid var(--accent);padding:10px 14px;border-radius:4px;font:600 13px var(--display);opacity:0;pointer-events:none;transition:opacity .2s;width:max-content;max-width:calc(100% - 32px);z-index:30;text-align:center}
#toast.show{opacity:1}
#toast.up{border-color:var(--gold);color:var(--gold)}
#toast.bad{border-color:var(--danger);color:var(--danger)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 10px 0 #7a4bff66}50%{box-shadow:0 0 26px 4px #9266ffaa}}
@media (prefers-reduced-motion:reduce){.enemy.hit,.ally .me.hit,.arisebtn{animation:none}.bar i{transition:none}}
@media (max-width:380px){.stats4{grid-template-columns:repeat(2,1fr)}}
.stats4.stats5{grid-template-columns:repeat(5,1fr);gap:5px}.stats5 .cell{padding:8px 2px}.stats5 .cell b{font-size:15px}.stats5 .cell span{font-size:8.5px;letter-spacing:.04em}
.telebox{min-height:40px;margin-top:6px;font-size:12px;color:var(--danger);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3}
.telebox b{letter-spacing:.1em;margin-right:6px}
.stline{min-height:24px;margin-bottom:4px}
.door{display:block;width:100%;text-align:left;background:#0d1330;border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:8px;color:var(--fg);cursor:pointer;min-height:56px}
.door b{display:block;font:600 15px var(--display);letter-spacing:.03em;margin-bottom:2px}
.door span{font-size:13px;color:var(--muted)}
.door:hover{border-color:var(--accent)}
.fbox{margin-top:8px;padding:8px 10px;border:1px solid #1d2a5c;border-radius:4px;font-size:12px;color:var(--gold)}
.trs{margin:4px 0}
.panel.story{border-color:#3a2d7a}
.panel.tower{border-color:#5a3d9a}
#actbar .acts .btn.spc{border-color:var(--violet)}
/* compatto per telefono, combattimento senza scroll */
body.cb{padding-block:12px 0;font-size:13px}
.cb .top{margin-bottom:6px;gap:8px}
.cb .rk{width:34px;height:34px;font-size:20px;border-width:1px}
.cb .nm{font-size:14px}.cb .nm span{font-size:12px}
.cb .who .sm,.cb .gold small{display:none}
.cb .gold{font-size:14px}
.cb .bar{margin-top:3px}
.cb .who .bar{height:5px}
.cb .panel{padding:8px 10px;margin-bottom:6px}
.cb .lbl{margin:0 0 4px;font-size:10px;letter-spacing:.14em}
.cb .enemy{min-height:0;padding:0}
.cb .enemy .en{font-size:16px;min-height:0;margin-bottom:3px}
.cb .bar.big{height:9px}
.cb .enemy .sm{margin-top:2px;font-size:11px}
.cb .telebox{min-height:30px;margin-top:2px;font-size:11px}
.cb .stline{min-height:19px;margin-bottom:2px}
.cb .stline .tag{font-size:9px;margin-right:4px}
.cb .ally{gap:4px 8px}
.cb .ally .n{font-size:11px}
.cb .ally .sm{font-size:11px;margin-top:1px}
.cb .log{height:88px}
.cb .lg{font-size:12px;padding:1px 0;line-height:1.3}
.cb .btn{min-height:40px;padding:6px 10px}
.cb #actbar{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.cb #actbar .acts{gap:5px}
.cb #actbar .acts .btn{min-height:42px;font-size:10.5px}
.cb #actbar .acts .btn small{font-size:9px;margin-top:1px}
.cb .door{padding:8px 10px;min-height:44px;margin-bottom:5px}
.cb .door b{font-size:14px}.cb .door span{font-size:12px}
.cb .panel.arise .big{font-size:16px;margin:0 0 2px}
.cb .row{padding:6px 0}
.cb .full-warn{padding:6px 8px;font-size:11px;margin:6px 0}
.cb .sum,.cb .loot{font-size:12px}
@media (max-height:700px){.cb .log{height:70px}}
/* v9: schermate compatte */
.cb .log{height:66px}
.cb .lg{font-size:11px;padding:0;line-height:1.25}
.duo{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:8px}
.duo .btn{margin:0;min-height:48px}
.duo .arisebtn{font-size:20px;letter-spacing:.2em;min-height:48px}
.cb .panel.arise p.sm{margin:2px 0}
.doors3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cb .doors3 .door{margin:0;padding:8px 6px;text-align:center;min-height:0;display:flex;flex-direction:column;gap:3px}

.cb .doors3 .door span{font-size:10.5px;line-height:1.25}

/* v13: viste compatte (tranne Ombre) */
body.cp:not(.tomb){font-size:14px;line-height:1.35;padding-block:18px 74px}
.cp:not(.tomb) .top{margin-bottom:8px;gap:10px}
.cp:not(.tomb) .rk{width:40px;height:40px;font-size:23px}
.cp:not(.tomb) .panel{padding:10px;margin-bottom:8px}
.cp:not(.tomb) .lbl{margin-bottom:6px}
.cp:not(.tomb) .row{padding:6px 0}
.cp:not(.tomb) .btn{min-height:40px;padding:6px 10px}
.cp:not(.tomb) .btn.sm2{min-height:34px}
.cp:not(.tomb) .rn{font-size:14px}
.cp:not(.tomb) .gate{padding:8px 10px;margin-bottom:6px;gap:4px 10px}
.cp:not(.tomb) .gate .g{width:36px;height:36px;font-size:20px}
.cp:not(.tomb) .gate .gt{font-size:14px}
.cp:not(.tomb) .gate .sm{margin-top:1px}
.cp:not(.tomb) .qc{padding:6px 8px}
.cp:not(.tomb) .qrow{margin-bottom:6px}
.cp:not(.tomb) .warnbox{padding:6px 8px;font-size:11px;margin-top:8px}
.cp:not(.tomb) .chips{margin-bottom:6px}
.cp:not(.tomb) .chip{min-height:34px}
.cp:not(.tomb) .cell{padding:5px 4px}
.cp:not(.tomb) .cell b{font-size:15px}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.at{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:3px;padding:6px 8px}
.at .grow .rn{font-size:13px}.at .grow .sm{margin:0;font-size:10.5px}
.at .val{font-size:18px;min-width:26px}
.at .btn.sq{width:36px;min-height:36px;font-size:18px}
/* v16 */
.mini{font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:3px;padding:3px 8px;min-height:0;cursor:pointer}
.mini.off{color:var(--muted)}
.mini.dng{color:var(--danger);border-color:#7a2a3b}
.lbl .mini{margin:-3px 0}
.leaverow{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--muted)}
/* v17 */
.stats3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats3 .cell b{font-size:13px}
.stats3 .cell span{font-size:9px}
.hrow{display:grid;grid-template-columns:auto 1fr;gap:0 8px;padding:5px 0;border-top:1px solid #1a2552;font-size:12px}
.hrow .hr{font:700 10px var(--display);letter-spacing:.08em;text-transform:uppercase;align-self:center}
.hrow .hs{grid-column:2;color:var(--muted);font-size:11px}
@media (max-width:380px){.stats3{grid-template-columns:repeat(3,1fr)}}
/* v18 ombre */
.sech{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;padding:5px 10px;border-radius:3px;background:#141a3a;font:700 11px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sech.act{background:#2a1f6b;color:#d7caff}
.sech em{font-style:normal;font-size:10px;letter-spacing:.06em}
.sh{position:relative;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:4px;padding:0;margin-bottom:6px;display:grid;grid-template-columns:1fr auto;align-items:stretch}
.sh.act{border-color:#5b3fc0;border-left-color:var(--cc);background:linear-gradient(90deg,#171040,var(--panel))}
.sh.ben{border-style:dashed;border-left-style:solid;opacity:.88}
.sh.empty{display:block;border-left-color:#26356f;border-style:dashed;padding:9px 10px;font-size:12px;color:var(--muted);background:transparent;grid-template-columns:none}
.shh{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;background:transparent;border:0;color:var(--fg);padding:8px 6px 8px 8px;cursor:pointer;min-width:0}
.shc{font:700 11px var(--display);color:var(--cc);border:1px solid var(--cc);border-radius:2px;padding:2px 4px;letter-spacing:.06em}
.shm{display:flex;flex-direction:column;gap:2px;min-width:0}
.shn{font:600 14px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shn i{font-style:normal;color:var(--accent);font-size:12px}.shn i.u{color:var(--danger);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.shs{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 4px}
.tg{font-size:10px;color:#b79cff;border:1px solid #3a2d7a;border-radius:2px;padding:0 4px}
.chev{font-size:10px;color:var(--muted)}
.shb{align-self:center;margin:0 8px 0 0;font:600 10px var(--display);letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:7px 8px;min-height:36px;cursor:pointer;max-width:92px}
.shb.go{color:var(--fg);border-color:var(--accent);background:#10265a}
.shb:disabled{opacity:.4;cursor:not-allowed}
.sh .shd{grid-column:1/-1;padding:0 8px 8px;border-top:1px solid #1a2552;margin-top:2px}
.sh .shd .sm{margin-top:5px}
.sh .shd .btns{margin-top:6px}
.sh .shd .slots{margin-top:6px}

  if(o.qv!==3){var oldDone=0,nq={};for(var qk2 in (o.gq||{})){if(/^[ED]\./.test(qk2)&&qk2!=='E.8'&&qk2!=='D.0')nq[qk2]=o.gq[qk2];else if(o.gq[qk2].s===2)oldDone++}o.gq=nq;o.qv=3;if(oldDone)o.gold=(o.gold||0)+oldDone*(150+20*(o.lv||1))}
  var d=fresh();for(var k in d){if(o[k]===undefined)o[k]=d[k]}
  if(!hadCnt){o.cnt.kill=o.kills||0;o.cnt.gate=o.gates||0}
  var ic=o.st.int,cp0=(ic>=5?1:0)+(ic>=15?1:0)+(ic>=25?1:0)+(ic>=40?1:0),act0=0;
  o.shadows.forEach(function(s,i){
    if(s.a===undefined){s.a=act0<cp0;if(s.a)act0++}
    if(!s.cls)s.cls=CLK[(s.id||i)%4];
    if(s.heal===undefined)s.heal=s.cls==='guaritore'?s.atk:0;
    if(!s.eq)s.eq={w:null,a:null};
    if(s.r===undefined)s.r=0;
    if(!s.tr)s.tr=[];
  });
  if(shift){
    o.inv.forEach(function(it){if(it.t>=1)it.t++});
    o.shadows.forEach(function(s){['w','a'].forEach(function(k){if(s.eq[k]&&s.eq[k].t>=1)s.eq[k].t++})});
  }
  o.tv=2;

  if(o.mv!==3&&o.mv!==4){
    o.mv=3;
    ['C.2','A.2'].forEach(function(k){if(o.gq&&o.gq[k]&&o.gq[k].s===1)delete o.gq[k]});
    if(o.shadows.length>8){

      var srt=o.shadows.slice().sort(function(a,b){return sc(b)-sc(a)}),keep=srt.slice(0,8),out=srt.slice(8);

}

function addB(b,cls,k,t){
  var f=PCT[t];
  if(cls==='tank'){if(k==='w')b.atk+=f;else{b.hp+=f*1.3;b.red+=Math.min(.35,f*.4)}}
  else if(cls==='mago'){if(k==='w')b.atk+=f*1.2;else{b.hp+=f*.8;b.atk+=f*.3}}
  else if(cls==='assassino'){if(k==='w')b.atk+=f;else{b.crit+=Math.min(.2,f*.3);b.hp+=f*.5}}
  else{if(k==='w'){b.heal+=f*1.2;b.atk+=f*.3}else{b.hp+=f*.8;b.heal+=f*.4}}
}

    gold:Math.round((4+1.6*L)*(boss?4:(el?2.2:1))*pen*gm*((c&&!c.tower&&c.rwT)||1)),
    pas:[],tl:[],ev:4,sh:0,shMax:0,shDone:false,turns:0,tele:null,rs:d.r?{p:d.r[0],m:d.r[1]}:{p:RSC[d.c].p,m:RSC[d.c].m},dt:(d.c==='mago'||d.c==='guaritore')?'m':'p'};

function hurtE(d,pierce,magic,ign){
  var e=c.e,rf=(e.rs&&e.rs[magic?'m':'p'])||1;if(ign&&rf<1)rf=1;

function pAct(k){
  if(!c||c.busy||c.phase!=='fight')return;
  var s=SK[k],sp=SPEC[p.spec];
  if(k==='spec'){
    if(!sp||p.mp<spCost())return;
    p.mp-=spCost();quest('skills',1);qev('skill',1);qev('spec',1);
    var tot=0,parts=[];
    sp.m.forEach(function(m){var h=hitCalc(m,sp.force,!sp.phys);tot+=h.d;parts.push(h.cr?h.d+'!':String(h.d));if(h.cr)qev('crit',1)});
    hurtE(tot,sp.pierce,!sp.phys,sp.ign);c.flash='e';
    if(sp.wall){c.wall=true;log('Muro d’ombra: i danni subiti nel prossimo turno sono dimezzati.','good')}
    if(sp.cmd){c.cmd=true;log('Comando d’ombra: '+parts.join(' + ')+' danni'+rsNote(!sp.phys)+'. Le ombre agiranno due volte!','hit')}
    else log(sp.s+': '+parts.join(' + ')+' danni'+(sp.ign?' · ignora le resistenze':rsNote(!sp.phys)),'hit');
  }else if(s){
    var cost=k==='atk'?0:skCost(k);

    p.mp-=cost;
    if(k!=='atk'){quest('skills',1);qev('skill',1)}
    if(k==='fury')qev('fury',1);
    var tot2=0,parts2=[];
    s.m.forEach(function(m){var h=hitCalc(m,false,k!=='atk');tot2+=h.d;parts2.push(h.cr?h.d+'!':String(h.d));if(h.cr){qev('crit',1)}});
    hurtE(tot2,false,k!=='atk');c.flash='e';
    log(s.n+': '+parts2.join(' + ')+' danni'+rsNote(k!=='atk'),'hit');
  }else if(k==='def'){
    c.def=true;c.usedDef=true;p.mp=Math.min(maxMp(),p.mp+Math.max(8,Math.round(maxMp()*.08)));
    log('Ti metti in guardia e recuperi MP.','sys');
  }else if(k==='ph'){
    if(p.potH<1||p.hp>=maxHp())return;
    p.potH--;c.pot=true;qev('pot',1);p.sx.pot++;var h=healP(maxHp()*(tn('c')>=4?.65:.5));
    team().forEach(function(sh){if(sh.hp>0)healS(sh,sMax(sh)*.25)});

  }else if(k==='pm'){
    if(p.potM<1||p.mp>=maxMp())return;
    p.potM--;c.pot=true;qev('pot',1);p.sx.pot++;var m=Math.round(maxMp()*.6);p.mp=Math.min(maxMp(),p.mp+m);log('Pozione di mana: +'+m+' MP','good');
  }else if(k==='pa'){
    if(p.potA<1||!(c.st.poison||c.st.curse>0||c.st.stun>0))return;
    p.potA--;c.pot=true;qev('pot',1);p.sx.pot++;c.st={poison:null,stun:0,curse:0};log('Antidoto: ogni status è rimosso.','good');
  }else if(k==='pb'){
    if(p.potB<1||c.buff>0)return;
    p.potB--;c.pot=true;qev('pot',1);p.sx.pot++;c.buff=3;var eh=healP(maxHp()*.4);p.mp=Math.min(maxMp(),p.mp+Math.round(maxMp()*.4));c.st={poison:null,stun:0,curse:0};team().forEach(function(sh){if(sh.hp>0)healS(sh,sMax(sh)*.2)});log('Elisir del Monarca: +'+eh+' HP, +40% MP, status rimossi e +30% di danni per 3 turni!','good');
  }else if(k==='flee'){endGate();return}
  else return;

function cycle(){

    if(c.e.hp<=0){c.busy=false;win();return}

    c.busy=false;
    if(p.hp<=0){if(p.potF>0){p.potF--;p.hp=Math.max(1,Math.round(maxHp()*.5));c.pot=true;p.sx.pot++;log('Piuma di Fenice: torni in vita con il 50% degli HP!','good');toast('Piuma di Fenice!','up')}else{lose();return}}
    if(c.st.stun>0){c.st.stun--;c.stunCd=2;c.def=false;log('Sei stordito: salti il turno.','bad');cycle();return}

function endRound(){
  var st=c.st;

  if(sig()==='curse'&&c.rt%4===0&&!c.def&&c.st.curse<=0){log('La maledizione del santuario ti colpisce!','bad');applyStatus('curse')}
  if(sig()==='fire'&&p.hp>0){var fd=Math.max(1,Math.round(maxHp()*.015));p.hp=Math.max(0,p.hp-fd);c.flash='p';log('Il calore ti brucia: -'+fd+' HP','bad')}

  if(e.hp>0&&e.pas.indexOf('regen')>=0){var h=Math.round(e.max*.03);e.hp=Math.min(e.max,e.hp+h);log(e.name+' si rigenera: +'+fmt(h),'bad')}

function shadowsTurn(){

function shadowAct(s){

      if(best==='p'){var g1=healP(h);log(s.name+' ti cura: +'+g1+' HP','good')}

        team().forEach(function(o){if(o.hp>0)healS(o,sHeal(s)*.6)});

}
function enemyTurn(){

      else{p.hp=Math.max(0,p.hp-pd);c.flash='p'}
      var txt=e.name+' travolge tutti: -'+pd+' a te';
      team().forEach(function(s){

        s.hp=Math.max(0,s.hp-sd2);

      });
      log(txt+' e alle ombre.','bad');
    }else if(x.t==='p'){
      if(Math.random()<dodge()){log('Schivi l’attacco!','good');qev('dodge',1)}
      else{
        var K2=50+2*p.lv,dm=d*dmgTaken(e)*K2/(K2+p.st.vit);if(c.def)dm*=.5;dm=Math.max(1,Math.round(dm));

          if(!e.boss&&e.cls==='mago'&&e.g>=1)pc=Math.max(pc,.2);

      var s=x.s;d=d*CL[s.cls].dr*(1-sB(s).red);d=Math.max(1,Math.round(d));

      s.hp=Math.max(0,s.hp-d);

      if(s.cls==='tank'&&hasAb(s)&&s.hp>0&&Math.random()<.25){var cd=Math.max(1,Math.round(sAtk(s)*.8));hurtE(cd);log(s.name+' contrattacca: '+cd,'shadow')}
      }

    var nx=e.tl[(e.turns/e.ev-1)%e.tl.length];e.tele=nx;

  }
}

function ariseChance(e){return Math.min(.6,(c&&c.oracle?.05:0)+(e.boss?.08+p.st.int*.005:e.el?.15+p.st.int*.006:.22+p.st.int*.008)+(tn('o')>=4&&!e.boss?.06:0)+(p.spec==='necro'?.1:0))}

function doArise(){

    }

    var sh={id:++p.sid,name:e.boss?BN[e.g]:e.name.replace('Élite · ',''),boss:e.boss,el:!!e.el,u:uid,cls:e.cls,r:r,tr:[],atk:r1(e.atk*.33*m.atk),max:Math.round(e.max*.4*m.hp),heal:e.cls==='guaritore'?r1(e.atk*.28):0,up:0,eq:{w:null,a:null},hp:0};
    if(e.boss){var ft=BTR[e.g];if(ft==='devoto'&&e.cls!=='guaritore')ft='furia';sh.tr.push(ft);for(var i=0;i<r-1;i++)addTrait(sh)}

    if(p.shadows.length<maxTotal()){
      sh.a=team().length<cap()&&canField(sh);p.shadows.push(sh);c.ok=true;c.msg=sh.name+' ('+RARITY[r].n+') '+(sh.a?'si unisce alla tua squadra come ':'va in panchina come ')+CL[sh.cls].n+'.';c.got.push(sh.name);c.phase='ariseRes';
    }else{c.pend=sh;c.phase='replace'}
  }else{p.sx.fail++;c.ok=false;c.msg='Estrazione fallita. L’ombra si dissolve.';c.phase='ariseRes'}
}
function doReplace(id){
  var old=findShadow(id);if(!old||!c.pend)return;
  var same=old.cls===c.pend.cls&&(old.eq.w||old.eq.a),moved=false;
  if(same){['w','a'].forEach(function(k){if(old.eq[k]){c.pend.eq[k]=old.eq[k];old.eq[k]=null;moved=true}})}
  dropShadow(old);
  c.pend.a=old.a&&canField(c.pend,old);p.shadows[p.shadows.indexOf(old)]=c.pend;c.pend.hp=sMax(c.pend);
  c.ok=true;c.msg=c.pend.name+' prende il posto di '+old.name+'.'+(moved?' L\u2019equipaggiamento passa alla nuova ombra.':'');c.got.push(c.pend.name);c.pend=null;c.phase='ariseRes';

function chooseDoor(k){

  }

  team().forEach(function(s){var m=sMax(s);s.hp=Math.min(m,Math.max(0,s.hp)+Math.round(m*.3))});

    case 'uneq':
      var up2=v.split(':'),us=findShadow(up2[0]);
      if(us&&us.eq[up2[1]]){p.inv.push(us.eq[up2[1]]);us.eq[up2[1]]=null;us.hp=sMax(us);selSlot=null}
      break;
    case 'up':
      var s2=findShadow(v);
      if(s2&&s2.up<upMax()){var uc=upCost(s2);if(p.gold>=uc){p.gold-=uc;upgrade(s2)}}
      break;
    case 'rel':
      if(relId===+v){var rs=findShadow(v);if(rs){dropShadow(rs);p.shadows=p.shadows.filter(function(s){return s!==rs})}relId=null;selSlot=null}
      else relId=+v;
      break;
    case 'fuse':
      var fs=findShadow(v),fp=fs&&partner(fs);
      if(fs&&fp){
        if(fuseId===fs.id){
          ['w','a'].forEach(function(k){if(!fs.eq[k]&&fp.eq[k]){fs.eq[k]=fp.eq[k];fp.eq[k]=null}});
          dropShadow(fp);
          fs.r++;fs.atk=r1(Math.max(fs.atk,fp.atk)*1.05);fs.max=Math.round(Math.max(fs.max,fp.max)*1.05);fs.heal=r1(Math.max(fs.heal,fp.heal)*1.05);fs.up=Math.max(fs.up,fp.up);
          addTrait(fs);
          p.shadows=p.shadows.filter(function(s){return s!==fp});
          fs.hp=sMax(fs);fuseId=null;toast(fs.name+' diventa '+RARITY[fs.r].n+'!','up');
        }else fuseId=fs.id;
      }
      break;
    case 'evo':
      var vs=findShadow(v);
      if(vs&&vs.r<2&&vs.up>=10&&p.frag>=evoCost(vs)){
        p.frag-=evoCost(vs);vs.r++;vs.up=0;addTrait(vs);vs.hp=sMax(vs);
        toast(vs.name+' evolve in '+RARITY[vs.r].n+'!','up');
      }
      break;
    case 'bench':
      var bs=findShadow(v);
      if(bs){if(bs.a)bs.a=false;else if(team().length<cap()){if(canField(bs))bs.a=true;else toast('In squadra: massimo 1 ombra di boss e 1 di élite.')}}
      break;
    case 'c':pAct(v);return;
    case 'arise':doArise();break;
    case 'repl':doReplace(v);break;
    case 'door':chooseDoor(v);return;
    case 'next':nextRoom();return;
    case 'leavearm':leaveArm=true;break;
    case 'leavecancel':leaveArm=false;break;
    case 'stats':statsOpen=!statsOpen;break;
    case 'gtier':{var gv=v.split(':');p.gt=p.gt||{};p.gt[+gv[0]]=+gv[1];break}
    case 'tsel':tsel=(tsel===v?null:v);break;
    case 'tbuy':{var tp=v.split(':'),tk=tp[0],ti=+tp[1],tnd=NODES[tk]&&NODES[tk][ti];if(tnd&&tn(tk)===ti&&(tk==='r'||tn('r')>=1)&&p.frag>=tnd.c){addFrag(-tnd.c);p.tree[tk]=ti+1;toast('Sbloccato: '+tnd.s.replace(/<br>/g,' '),'up')}break}
    case 'respec':{
      if(!respecArm){respecArm=true;break}
      var rc=respecCost(),sp0=p.st.str+p.st.agi+p.st.int+p.st.vit-20;
      if(p.gold<rc||sp0<=0){respecArm=false;break}
      p.gold-=rc;p.pts+=sp0;p.st={str:5,agi:5,int:5,vit:5};fixTeam();p.hp=Math.min(p.hp,maxHp());p.mp=Math.min(p.mp,maxMp());respecArm=false;toast('Attributi azzerati: ridistribuisci '+p.pts+' punti','up');break}
    case 'respecno':respecArm=false;break;
    case 'exp':
      saveBox=JSON.stringify(p);
      try{navigator.clipboard.writeText(saveBox).catch(function(){})}catch(e){}
      break;
    case 'imp':saveBox='';break;
    case 'impgo':
      var tb=document.getElementById('savebox'),io=null;
      try{io=JSON.parse(tb.value)}catch(e){}
      if(io&&io.st&&io.lv){saveBox=null;adopt(io);return}
      toast('Salvataggio non valido.','bad');
      break;
    case 'open':openSh=(openSh===+v)?null:+v;if(openSh===null||(selSlot&&selSlot.sid!==+v))selSlot=null;break;
    case 'noarise':p.noArise=!p.noArise;break;
    case 'leave':leaveArm=false;endGate();return;
  }
  save();render();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  act(b.getAttribute('data-a'),b.getAttribute('data-v'));
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){flushCloud()}
  else if(!c)render();
});
window.addEventListener('pagehide',function(){flushCloud()});

boot(load()||migrate(fresh()));
render();
cloudInit();
})();
</script>
