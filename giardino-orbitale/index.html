button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#hd{padding:calc(env(safe-area-inset-top) + 40px) 14px 8px;background:#05061a;color:#fff;text-align:center;flex:none}
#hd .m{font-size:30px;font-weight:800;color:var(--yl);line-height:1.1}
#hd .s{font-size:12.5px;opacity:.85;margin-top:2px}
#sc{flex:none;position:relative;background:#05061a}
#cv{display:block;width:100%;touch-action:none}
#hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#fff;opacity:.85;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#tabs{display:flex;background:var(--pn);border-bottom:1px solid var(--ln);flex:none}
#tabs button{flex:1;padding:11px 2px;font-size:12px;font-weight:700;color:var(--mu);position:relative}
#tabs button.on{color:var(--gr2)}
#tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:2px;background:var(--gr)}
#tabs .dot{position:absolute;top:7px;right:14%;width:8px;height:8px;border-radius:50%;background:var(--or)}
#main{flex:1;overflow-y:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 16px);-webkit-overflow-scrolling:touch}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.row{display:flex;gap:10px;align-items:center}
.row .inf{flex:1;min-width:0}
.nm{font-weight:800;font-size:15px}
.nm i{font-style:normal;color:var(--gr2);font-size:13px;margin-left:6px}
.ds{font-size:12px;color:var(--mu);margin-top:2px;line-height:1.3}
.pr{font-size:12px;color:var(--bl);margin-top:3px;font-weight:600}
.btn{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.btn:active{transform:scale(.97)}
.btn.gr{background:linear-gradient(180deg,#52b57f,#3a9566);border-color:#2c7a52;color:#fff}
.btn.or{background:linear-gradient(180deg,#f0a04e,#dc7e2e);border-color:#c06c20;color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.by{min-width:96px;text-align:center;line-height:1.25}
.by small{display:block;font-weight:600;font-size:11px;opacity:.9}
.modes{display:flex;gap:6px;margin-bottom:10px}
.modes button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--ln);background:var(--pn);font-size:12px;font-weight:700;color:var(--mu)}
.modes button.on{background:#e3f2e9;color:var(--gr2);border-color:var(--gr)}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:12px 2px 6px;font-weight:700}
.cur{border-color:var(--gr);background:#eef8f1}
.lock{opacity:.5}
.tag{display:inline-block;font-size:10.5px;font-weight:800;background:var(--gr);color:#fff;border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:1px}
#modal{position:fixed;inset:0;background:rgba(20,30,25,.55);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--pn);border-radius:18px;padding:20px 18px;width:100%;max-width:340px;max-height:86vh;overflow:auto;text-align:center}
#modal h2{margin:0 0 8px;font-size:20px;color:var(--gr2)}
#modal p{font-size:14px;line-height:1.5;margin:8px 0}
#modal .col{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#05061a;color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;z-index:30;display:none;max-width:88%;text-align:center}
.mu{color:var(--mu)}
.log{font-size:12.5px;line-height:1.55}
textarea{width:100%;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:9px;font:12px monospace;color:var(--tx)}
</style>

(function(){

/* ================= NUMERI ENORMI (mantissa + esponente) ================= */
function N(m,e){this.m=m;this.e=e}
function norm(m,e){
  if(m===0||m!==m)return new N(0,0);

}

function add(a,b){a=n(a);b=n(b);if(!a.m)return b;if(!b.m)return a;

function neg(a){a=n(a);return new N(-a.m,a.e)}
function sub(a,b){return add(a,neg(b))}
function mul(a,b){a=n(a);b=n(b);return norm(a.m*b.m,a.e+b.e)}
function div(a,b){a=n(a);b=n(b);return norm(a.m/b.m,a.e-b.e)}
function cmp(a,b){a=n(a);b=n(b);
  if(!a.m&&!b.m)return 0;

function gte(a,b){return cmp(a,b)>=0}
function lg(a){a=n(a);return a.m>0?Math.log10(a.m)+a.e:-Infinity}
function pw(a,x){a=n(a);if(!a.m)return Z;var l=(Math.log10(a.m)+a.e)*x,e=Math.floor(l);return norm(Math.pow(10,l-e),e)}
function p10(x){var e=Math.floor(x);return norm(Math.pow(10,x-e),e)}

function fmt(a,dec){

  if(a.e<6){
    var v=toNum(a);

    return Math.floor(v).toLocaleString('it-IT');
  }

}
function fmtT(sec){sec=Math.max(0,Math.floor(sec));var d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d)return d+'g '+h+'h';if(h)return h+'h '+m+'m';if(m)return m+'m '+(sec%60)+'s';return sec+'s'}


/* ================= DATI ================= */

var KINDS={leaf:1,herb:1,root:1,stem:1,low:1,vine:1,flower:1,spike:1,mush:1,alga:1,pond:1,bush:1,tree:1,stalk:1,hive:1,fish:1,bonsai:1,carn:1,cactus:1,cocoon:1,alien:1,moss:1,crystal:1,coral:1};

['Bonsai di pino','bonsai','#2f6a3a','#7a4a2a'],['Bonsai d’acero','bonsai','#c83a2a','#7a4a2a'],['Bonsai di ginepro','bonsai','#3f8a5a','#7a4a2a'],['Ciliegio','tree','#6a9a4a','#f0a0b8'],['Bambù','stalk','#7fc45a','#5a9a3a'],
['Dionea','carn','#4faa4a','#e0405a'],['Nepenthes','carn','#6aaa4a','#c8403a'],['Fico d’India','cactus','#4faa6a','#e0508a'],['Aloe','cactus','#5ab88a','#7ad0a0'],['Ginseng','root','#7aaa5a','#e0c890'],
['Tartufo','mush','#3a2a20','#6a5a4a'],['Loto','pond','#6ac08a','#f0a0d0'],['Ninfea','pond','#4faa6a','#f4f0e0'],['Seta','cocoon','#e8e8e0','#9acc6a'],['Fiore di luna','alien','#8ad8ff','#e8f4ff'],

['Alga bioluminescente','alga','#30c0f0','#a0f0ff'],['Pianta lanterna','alien','#f0c040','#fff0a0'],['Vite di plasma','vine','#f060c0','#ffb0f0'],['Frutto del vuoto','alien','#3a2a6a','#a070f0'],['Fiore di quasar','flower','#f09030','#fff060'],

];
var TOOLN=['Mani nude','Forbicine','Cesoie da giardino','Coltello da innesto','Raccoglitore ergonomico','Guanti a presa magnetica','Cesoie al plasma','Braccio meccanico','Raccolta a ultrasuoni','Micro-laser di precisione','Manipolatore quantico','Mani dell’universo'];
var SOILN=['Terra comune','Torba','Humus','Compost orbitale','Idroponica','Aeroponica','Regolite fertilizzata','Microbioma attivo','Nutrienti sintetici','Biosfera chiusa','Substrato stellare','Terra primordiale'];

var MODS=[['shelf','Mensola con vasetti','Piccoli vasi sulla parete.'],['solar','Pannelli solari','Ali blu fuori dall’oblò.'],['lamp','Lampada a spettro pieno','Appesa sopra la serra.'],['tank','Serbatoio d’acqua','Riserva per le irrigazioni.'],['belt','Nastro trasportatore','Il raccolto viaggia da solo.'],['ant','Antenna','Per parlare con la Terra.'],['aqua','Vasca di acquaponica','Pesci e piante insieme.'],['hive','Alveare orbitale','Api a gravità zero.'],['robot','Robot giardiniere','Un amico che gira per la serra.'],['dome','Cupola panoramica','Vista a 360 gradi sulle stelle.'],['lights','Luci stellari','Ghirlande per le serate.'],['zen','Angolo zen','Una panchina e un po’ di pace.'],['sat','Seconda stazione','Un modulo gemello in orbita.'],['ring','Anello rotante','Gravità artificiale per tutti.'],['wtree','Albero del mondo','Cresce al centro della serra.']];
var SHOP=[['rich','Terreno ricco','Raccolti circa ×1,22 per livello.',3,2],['nurs','Vivaio','Ogni livello: riparti con 4 piante già sbloccate.',5,3],['drn','Droni efficienti','Automazione ×1,4 per livello.',4,2],['off','Ore offline','+2 ore di guadagno offline per livello (max 6).',3,2.5],['luck','Raccolto d’oro','+3% di probabilità di un raccolto ×8 per livello (max 10).',6,2.5]];
var PLV=[],TOOL=[],SOIL=[],LIGHT=[],POLL=[],MODC=[],DR=[];
function build(){
 PLV=[];DR=[];PL.forEach(function(p,i){var v=pw(CFG.G,i),c=i?mul(CFG.C0,pw(CFG.R,i-1)):Z;PLV.push({v:v,c:c});DR.push(i?mul(c,CFG.drone[0]):n(4000))});
 function lad(L,names,pr,add){var a=[];names.forEach(function(nm,k){a.push([nm,k?mul(pr[0],pw(pr[1],k-1)):Z,add?(1+pr[2]*k):Math.pow(pr[2],k)])});return a}
 TOOL=lad(0,TOOLN,CFG.tool);SOIL=lad(0,SOILN,CFG.soil);LIGHT=lad(0,LIGHTN,CFG.light);POLL=lad(0,POLLN,CFG.poll,1);
 MODC=MODS.map(function(m,i){return[m[0],mul(CFG.mod[0],pw(CFG.mod[1],i)),.05+i*.012]});
}
var KEY='giardino-orbitale-v1';
/* ================= STATO ================= */
function fresh(){return{v:1,m:Z,tot:Z,ok:Z,best:Z,np:1,sel:0,gen:{},tool:0,soil:0,light:0,poll:0,mods:{},dr:{},hub:0,semi:Z,shop:{},orbits:0,hits:0,played:0,tab:'serra',mode:1,last:Date.now(),gold:0}}
var S=fresh();
function applyShop(){var L=S.shop.nurs||0;if(L)S.np=Math.max(S.np,Math.min(PL.length,1+4*L))}
function serS(o){var r={};for(var k in o)r[k]=ser(o[k]);return r}
function save(){try{var o={v:1,m:ser(S.m),tot:ser(S.tot),ok:ser(S.ok),best:ser(S.best),semi:ser(S.semi),np:S.np,sel:S.sel,gen:S.gen,tool:S.tool,soil:S.soil,light:S.light,poll:S.poll,mods:S.mods,dr:S.dr,hub:S.hub,shop:S.shop,orbits:S.orbits,hits:S.hits,played:S.played,tab:S.tab,gold:S.gold,last:Date.now()};localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function load(raw){try{var o=JSON.parse(raw||localStorage.getItem(KEY));if(!o||o.v!==1)return false;var s=fresh();['m','tot','ok','best','semi'].forEach(function(k){s[k]=par(o[k])});['np','sel','tool','soil','light','poll','hub','orbits','hits','played','gold','last'].forEach(function(k){if(o[k]!==undefined)s[k]=o[k]});['gen','mods','dr','shop'].forEach(function(k){s[k]=o[k]||{}});s.tab=o.tab||'serra';S=s;return true}catch(e){return false}}
/* ================= CALCOLI ================= */
function gl(i){return S.gen[i]||0}
function shopL(k){return S.shop[k]||0}
function modBonus(){var b=0;MODC.forEach(function(m){if(S.mods[m[0]])b+=m[2]});return b}
function semiMult(){return add(1,mul(S.semi,.1))}
function baseMult(){var m=mul(TOOL[S.tool][2]*SOIL[S.soil][2]*LIGHT[S.light][2],(POLL[S.poll][2]+modBonus()));m=mul(m,semiMult());m=mul(m,Math.pow(1.5,shopL('rich')));return m}
function plantMult(i){return mul(baseMult(),Math.pow(CFG.gen[2],gl(i)))}
function tapVal(i){return pw(mx(mul(PLV[i].v,plantMult(i)),1e-9),CFG.Q)}
function drRate(L){return .25*L}
function autoInc(){var t=Z;for(var k in S.dr){var L=S.dr[k];if(L>0&&+k<S.np)t=add(t,mul(tapVal(+k),drRate(L)))}
 return mul(mul(t,Math.pow(CFG.hub[2],S.hub)),Math.pow(1.4,shopL('drn')))}
var CA={tap:Z,inc:Z};
function calc(){CA.tap=tapVal(S.sel);CA.inc=autoInc();return CA}
function addMoney(v){S.m=add(S.m,v);S.tot=add(S.tot,v);S.ok=add(S.ok,v);if(cmp(S.tot,S.best)>0)S.best=S.tot}
function tickGain(dt){calc();if(CA.inc.m)addMoney(mul(CA.inc,dt))}
function pay(c){if(cmp(S.m,c)<0)return false;S.m=mx(0,sub(S.m,c));return true}
function reqGen(i){return Math.min(CFG.rg[0]+Math.floor(i*CFG.rg[1]),CFG.rg[2])}
function reqUp(i){return Math.min(Math.floor(i*.45),40)}
function upTot(){return S.tool+S.soil+S.light+S.poll}
function plantOk(){var i=S.np;return i<PL.length&&gl(i-1)>=reqGen(i)&&upTot()>=reqUp(i)&&cmp(S.m,PLV[i].c)>=0}
function genCost(i){return mul(mul(mx(PLV[i].c,20),CFG.gen[0]),pw(CFG.gen[1],gl(i)))}
function drCost(i){var L=S.dr[i]||0;return mul(DR[i],pw(CFG.drone[1]||1.3,L))}
function hubCost(){return mul(CFG.hub[0],pw(CFG.hub[1],S.hub))}
function shopCost(k){var d=SHOP.filter(function(x){return x[0]===k})[0];return mul(d[3],pw(d[4],shopL(k)))}
function shopMax(k){return k==='off'?3:(k==='luck'?10:(k==='nurs'?19:999))}

function modal(h){$('modal').innerHTML='<div class="box">'+h+'</div>';$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}
function renderTop(){calc();$('mn').textContent=fmt(S.m)+' Cr';$('ms').textContent=PL[S.sel][0]+' · raccolto '+fmt(CA.tap)+' Cr'+(CA.inc.m?' · auto '+fmt(CA.inc)+'/s':'')}
function renderTabs(){var h='';TABS.forEach(function(t){var dot='';
 if(t[0]==='serra'&&plantOk())dot='<span class="dot"></span>';
 if(t[0]==='dr'&&!autoUnlocked())return;
 if(t[0]==='alt'&&semiGain().m)dot='<span class="dot"></span>';
 h+='<button data-a="tab" data-v="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+dot+'</button>'});
 if($('tabs').dataset.k!==h){$('tabs').innerHTML=h;$('tabs').dataset.k=h}}
function bb(ok,label,sub,cls,data){return'<button class="btn by '+(ok?(cls||'gr'):'')+'" '+data+' '+(ok?'':'disabled')+'>'+label+(sub?'<small>'+sub+'</small>':'')+'</button>'}
function can(c){return cmp(S.m,c)>=0}
function Qp(x){return Math.pow(x,CFG.Q)}
function rm(v){return'×'+(v<10?v.toFixed(2):Math.round(v)).toString().replace('.',',')}
function pc(x){return'+'+Math.round((Qp(x)-1)*100)+'%'}
function renderSerra(){
 var h='<div class="card"><div class="nm">La tua serra<i>'+S.np+' / '+PL.length+' specie</i></div><div class="ds">Tocca la scena per raccogliere. Per sbloccare una nuova specie devi prima potenziare quella attuale e migliorare attrezzi, terreno, luce e impollinatori.</div></div>';
 if(S.np<PL.length){var i=S.np,p=PL[i];h+='<div class="sec">Prossima specie</div><div class="card row"><div class="inf"><div class="nm">'+p[0]+'</div><div class="ds">'+KIND_IT[p[1]]+'</div><div class="pr">Vale '+fmt(pw(PLV[i].v,CFG.Q))+' Cr base</div><div class="ds" style="margin-top:4px">Per sbloccarla: Selezione di '+PL[i-1][0]+' <b style="color:'+(gl(i-1)>=reqGen(i)?'#2c7a52':'#c0443a')+'">'+Math.min(gl(i-1),reqGen(i))+'/'+reqGen(i)+'</b> · Potenziamenti (attrezzi, terreno, luce, impollinatori) <b style="color:'+(upTot()>=reqUp(i)?'#2c7a52':'#c0443a')+'">'+Math.min(upTot(),reqUp(i))+'/'+reqUp(i)+'</b></div></div>'+bb(plantOk(),fmt(PLV[i].c)+' Cr','','gr','data-a="plant"')+'</div>'}
 if(S.np+1<PL.length)h+='<div class="card lock row"><div class="inf"><div class="nm">???</div><div class="ds">Altre '+(PL.length-S.np-1)+' specie da scoprire.</div></div><span class="mu">🔒</span></div>';
 h+='<div class="sec">Le tue piante</div>';
 for(var k=S.np-1;k>=0;k--){var q=PL[k],cur=k===S.sel;
  h+='<div class="card row '+(cur?'cur':'')+'"><div class="inf"><div class="nm">'+q[0]+(cur?'<span class="tag">in coltivazione</span>':'')+'<i>sel. '+gl(k)+'</i></div><div class="ds">'+KIND_IT[q[1]]+'</div><div class="pr">'+fmt(tapVal(k))+' Cr a raccolto</div></div><div style="display:flex;flex-direction:column;gap:6px">'+(cur?'':'<button class="btn" data-a="sel" data-v="'+k+'">Coltiva</button>')+bb(can(genCost(k)),fmt(genCost(k))+' Cr','Selezione','or','data-a="gen" data-v="'+k+'"')+'</div></div>'}
 return h}
var KIND_IT={leaf:'Ortaggio a foglia',herb:'Erba aromatica',root:'Ortaggio da radice',stem:'Ortaggio da frutto',low:'Frutto di bosco',vine:'Rampicante',flower:'Fiore',spike:'Fiore a spiga',mush:'Fungo',alga:'Alga',pond:'Pianta acquatica',bush:'Arbusto da frutto',tree:'Albero',stalk:'Cereale o canna',hive:'Prodotto dell’alveare',fish:'Acquaponica',bonsai:'Bonsai',carn:'Pianta carnivora',cactus:'Succulenta',cocoon:'Seta',alien:'Specie aliena',moss:'Muschio',crystal:'Pianta di cristallo',coral:'Corallo vivente'};
function ladCard(title,desc,arr,idx,key,isB){var nx=arr[idx+1],h='<div class="card"><div class="nm">'+title+'<i>'+arr[idx][0]+'</i></div><div class="ds">'+desc+'</div>';
 if(nx)h+='<div style="margin-top:8px" class="row"><div class="inf"><div class="nm" style="font-size:14px">'+nx[0]+'</div><div class="pr">'+(isB?'Raccolti '+pc(nx[2]/arr[idx][2]):'Raccolti '+rm(Qp(nx[2]/arr[idx][2])))+'</div></div>'+bb(can(nx[1]),fmt(nx[1])+' Cr','','gr','data-a="lad" data-v="'+key+'"')+'</div>';else h+='<div class="pr">Livello massimo</div>';return h+'</div>'}
function renderPot(){
 var h='<div class="card"><div class="nm">Moltiplicatore totale</div><div class="ds">Tutti i potenziamenti si applicano a ogni raccolto: <b>×'+fmt(pw(mx(baseMult(),1e-9),CFG.Q))+'</b></div></div>';
 h+=ladCard('Attrezzi','Per raccogliere meglio e più in fretta.',TOOL,S.tool,'tool');
 h+=ladCard('Terreno','Più nutriente = più resa.',SOIL,S.soil,'soil');
 h+=ladCard('Illuminazione','La luce fa crescere tutto.',LIGHT,S.light,'light');
 h+=ladCard('Impollinatori','Aggiungono un bonus in percentuale.',POLL,S.poll,'poll',true);
 return h}
function renderMod(){
 var h='<div class="card"><div class="nm">La tua stazione</div><div class="ds">Ogni modulo si vede nella scena e aggiunge un bonus. Bonus totale: <b>'+pc(1+modBonus())+'</b></div></div>';
 MODS.forEach(function(m,i){var own=S.mods[m[0]],c=MODC[i][1];
  h+='<div class="card row '+(own?'cur':'')+'"><div class="inf"><div class="nm">'+m[1]+(own?'<span class="tag">montato</span>':'')+'</div><div class="ds">'+m[2]+'</div><div class="pr">Raccolti '+pc(1+MODC[i][2])+'</div></div>'+(own?'<span class="mu" style="font-weight:800">✓</span>':bb(can(c),fmt(c)+' Cr','','gr','data-a="mod" data-v="'+m[0]+'"'))+'</div>'});
 return h}
function renderDr(){
 if(!autoUnlocked())return'<div class="card"><div class="nm">Droni raccoglitori</div><div class="ds">Si sbloccano quando hai 10 specie nella serra.</div></div>';
 var h='<div class="card"><div class="nm">Droni raccoglitori</div><div class="ds">Un drone raccoglie al posto tuo la specie a cui è assegnato: '+drRate(1)+' raccolti al secondo per livello. Solo le piante che hai già sbloccato.</div></div>';
 h+='<div class="card row"><div class="inf"><div class="nm">Centrale di controllo<i>liv. '+S.hub+'</i></div><div class="ds">Tutti i droni sono più efficienti: '+rm(CFG.hub[2])+' per livello.</div></div>'+bb(can(hubCost()),fmt(hubCost())+' Cr','','or','data-a="hub"')+'</div>';
 for(var i=0;i<S.np;i++){var L=S.dr[i]||0,c=L?drCost(i):DR[i];
  h+='<div class="card row '+(L?'cur':'')+'"><div class="inf"><div class="nm">'+PL[i][0]+'<i>'+(L?'drone liv. '+L:'nessun drone')+'</i></div><div class="pr">'+(L?fmt(mul(tapVal(i),drRate(L)))+' Cr/s':'Raccolta automatica')+'</div></div>'+bb(can(c),fmt(c)+' Cr',L?'Potenzia':'Installa','gr','data-a="dr" data-v="'+i+'"')+'</div>'}
 return h}
function renderAlt(){
 var g=semiGain(),ok=g.m>0;
 var h='<div class="card"><div class="nm">Nuova orbita</div><div class="ds">Si sblocca a '+fmt(CFG.SEASON)+' Cr guadagnati. Ricominci da una serra spoglia, ma i moduli della stazione restano e ottieni <b>Semi rari</b>: valgono per sempre e si spendono qui sotto.</div><div style="margin-top:8px;font-size:13px">Guadagnati in questa orbita: <b>'+fmt(S.tot)+' Cr</b></div>'+(ok?'<div style="font-size:13px;margin-top:3px">Semi ottenibili: <b>+'+fmt(g)+'</b></div>':'')+'<button class="btn or" style="width:100%;margin-top:10px" data-a="orbit" '+(ok?'':'disabled')+'>Inizia una nuova orbita</button></div>';
 h+='<div class="card"><div class="nm">Semi rari<i>'+fmt(S.semi)+'</i></div><div class="ds">Ogni seme dà circa '+pc(1.1)+' ai raccolti.</div></div>';
 SHOP.forEach(function(s){var L=shopL(s[0]),c=shopCost(s[0]),mxl=L>=shopMax(s[0]);
  h+='<div class="card row"><div class="inf"><div class="nm">'+s[1]+'<i>liv. '+L+'</i></div><div class="ds">'+s[2]+'</div></div>'+(mxl?'<span class="mu">max</span>':bb(cmp(S.semi,c)>=0,fmt(c)+' semi','','or','data-a="shop" data-v="'+s[0]+'"'))+'</div>'});
 h+='<div class="card log"><b>Statistiche</b><br>Orbite: '+S.orbits+' · Raccolti con il tocco: '+S.hits.toLocaleString('it-IT')+'<br>Record in un’orbita: '+fmt(S.best)+' Cr<br>Guadagni totali: '+fmt(S.ok)+' Cr<br>Tempo di gioco: '+fmtT(S.played)+'</div>';
 h+='<div class="card"><b>Salvataggio</b><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" data-a="export">Esporta</button><button class="btn" style="flex:1" data-a="import">Importa</button></div><textarea id="sv" rows="3" placeholder="Qui compare il codice di salvataggio" style="margin-top:8px"></textarea></div><button class="btn" style="width:100%;color:#c0443a" data-a="reset">Cancella tutto e ricomincia</button>';
 return h}
function syncAttrs(x,y){var i,at;for(i=0;i<y.attributes.length;i++){at=y.attributes[i];if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value)}for(i=x.attributes.length-1;i>=0;i--){at=x.attributes[i];if(!y.hasAttribute(at.name))x.removeAttribute(at.name)}}
function morph(a,b){while(a.childNodes.length>b.childNodes.length)a.removeChild(a.lastChild);for(var i=0;i<b.childNodes.length;i++){var x=a.childNodes[i],y=b.childNodes[i];if(!x){a.appendChild(y.cloneNode(true));continue}if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y.cloneNode(true),x);continue}if(x.nodeType===3){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}if(x.nodeType!==1)continue;if(x.nodeName==='TEXTAREA')continue;syncAttrs(x,y);morph(x,y)}}
var shownTab=null;
function render(){renderTop();renderTabs();
 if(S.tab==='dr'&&!autoUnlocked())S.tab='serra';
 var m=$('main'),h=S.tab==='serra'?renderSerra():(S.tab==='pot'?renderPot():(S.tab==='mod'?renderMod():(S.tab==='dr'?renderDr():renderAlt())));
 var t=document.createElement('div');t.innerHTML=h;var st=m.scrollTop;if(shownTab!==S.tab){m.innerHTML='';shownTab=S.tab}morph(m,t);m.scrollTop=st}
/* ================= EVENTI ================= */
function ladOf(v){return{tool:[TOOL,'tool'],soil:[SOIL,'soil'],light:[LIGHT,'light'],poll:[POLL,'poll']}[v]}
document.addEventListener('click',function(ev){
 var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;
 if(a==='close'){closeModal();return}
 if(a==='tab'){S.tab=v;render();$('main').scrollTop=0;return}
 if(a==='sel'){S.sel=+v;render();return}
 if(a==='plant'){if(S.np<PL.length&&gl(S.np-1)>=reqGen(S.np)&&upTot()>=reqUp(S.np)&&pay(PLV[S.np].c)){S.sel=S.np;S.np++;toast('Nuova specie: '+PL[S.sel][0]);render();save()}return}
 if(a==='gen'){var i=+v;if(pay(genCost(i))){S.gen[i]=gl(i)+1;render();save()}return}
 if(a==='lad'){var arr=ladOf(v)[0],k=ladOf(v)[1],nx=arr[S[k]+1];if(nx&&pay(nx[1])){S[k]++;toast(nx[0]);render();save()}return}
 if(a==='mod'){var mi=MODS.map(function(m){return m[0]}).indexOf(v);if(!S.mods[v]&&pay(MODC[mi][1])){S.mods[v]=1;toast(MODS[mi][1]+' montato');render();save()}return}
 if(a==='hub'){if(pay(hubCost())){S.hub++;render();save()}return}
 if(a==='dr'){var d=+v;if(pay(drCost(d))){S.dr[d]=(S.dr[d]||0)+1;render();save()}return}
 if(a==='shop'){var c=shopCost(v);if(shopL(v)<shopMax(v)&&cmp(S.semi,c)>=0){S.semi=sub(S.semi,c);S.shop[v]=shopL(v)+1;render();save()}return}
 if(a==='orbit'){var g=semiGain();modal('<h2>Nuova orbita?</h2><p>Ottieni <b>+'+fmt(g)+' semi rari</b>. Piante, potenziamenti e droni ripartono da zero; i moduli della stazione restano.</p><div class="col"><button class="btn or" data-a="orbit2">Parti</button><button class="btn" data-a="close">Aspetta</button></div>');return}
 if(a==='orbit2'){var gg=newOrbit();closeModal();render();save();if(gg.m)toast('+'+fmt(gg)+' semi rari');return}
 if(a==='export'){save();$('sv').value=btoa(unescape(encodeURIComponent(localStorage.getItem(KEY)||'')));return}
 if(a==='import'){var t=$('sv').value.trim();try{var raw=decodeURIComponent(escape(atob(t)));if(load(raw)){save();render();toast('Salvataggio caricato')}else toast('Codice non valido')}catch(e){toast('Codice non valido')}return}
 if(a==='reset'){modal('<h2>Cancellare tutto?</h2><p>Perderai stazione, semi e progressi.</p><div class="col"><button class="btn" style="color:#c0443a" data-a="reset2">Sì, cancella</button><button class="btn" data-a="close">No</button></div>');return}
 if(a==='reset2'){S=fresh();save();closeModal();render();return}
});
/* ================= CICLO E OFFLINE ================= */
var lastT=0,uiT=0,saveT=0;
function loop(ts){var dt=Math.min(.5,(ts-lastT)/1000||0);lastT=ts;
 if(dt>0){S.played+=dt;tickGain(dt);frame(dt);renderTop();uiT+=dt;saveT+=dt;if(uiT>=.3){uiT=0;render()}if(saveT>=10){saveT=0;save()}}
 requestAnimationFrame(loop)}
function offline(sec){var use=Math.min(sec,offCap());calc();var g=mul(CA.inc,use);if(g.m>0){addMoney(g);modal('<h2>Bentornato!</h2><p>Mentre eri via i droni hanno lavorato per <b>'+fmtT(use)+'</b>.</p><p>Hai guadagnato <b>+'+fmt(g)+' Cr</b></p><div class="col"><button class="btn gr" data-a="close">Grazie</button></div>')}}
document.addEventListener('visibilitychange',function(){if(document.hidden){save();return}var sec=(Date.now()-S.last)/1000;if(sec>30)offline(sec);S.last=Date.now()});
window.addEventListener('pagehide',save);
/* ================= AVVIO ================= */
build();fitCanvas();
if(load()){var s0=(Date.now()-S.last)/1000;if(s0>30)offline(s0)}
else{modal('<h2>Giardino Orbitale</h2><p>Una serra in orbita, una piantina di lattuga e tutto lo spazio che vuoi. Tocca la scena per raccogliere: ogni raccolto lo fai tu. Compra nuove specie e potenziamenti, e più avanti potrai automatizzare quelle che hai sbloccato all’inizio.</p><p class="mu">Nessuna fretta, nessuna sconfitta.</p><div class="col"><button class="btn gr" data-a="close">Entriamo in serra</button></div>')}
S.last=Date.now();calc();render();requestAnimationFrame(loop);
window.TB={reqGen:reqGen,reqUp:reqUp,upTot:upTot,get S(){return S},set S(v){S=v},CFG:CFG,build:build,calc:calc,CA:CA,hit:hit,PL:PL,PLV:function(){return PLV},TOOL:function(){return TOOL},SOIL:function(){return SOIL},LIGHT:function(){return LIGHT},POLL:function(){return POLL},MODS:MODS,MODC:function(){return MODC},DR:function(){return DR},pay:pay,fmt:fmt,fresh:fresh,tickGain:tickGain,cmp:cmp,add:add,n:n,genCost:genCost,drCost:drCost,hubCost:hubCost,semiGain:semiGain,newOrbit:newOrbit,render:render,tapVal:tapVal,fmtT:fmtT,mul:mul,toNum:toNum};
})();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){var hadC=!!navigator.serviceWorker.controller,rl=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadC&&!rl){rl=true;location.reload()}});navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){r.update();document.addEventListener("visibilitychange",function(){if(!document.hidden)r.update()})}).catch(function(){})}
</script>
